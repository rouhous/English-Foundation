name: Audit question presentation before formatting update
on:
  push:
    paths:
      - 'scripts/audit_question_presentation_20261112.cjs'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit_question_presentation_20261112.cjs
      - name: Publish audit snippets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/quality-audit/question-presentation-audit-20261112.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit vocabulary and reading question presentation"
            git push
          fi
