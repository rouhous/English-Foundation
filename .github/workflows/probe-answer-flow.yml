name: Inspect answer handler
on:
  push:
    paths: ['scripts/probe_answer_flow.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: node scripts/probe_answer_flow.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/quality-audit/answer-flow-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record safe answer flow inspection"
            git push
          fi
