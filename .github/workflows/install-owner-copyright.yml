name: Install main application copyright notice
on:
  push:
    paths:
      - scripts/install_owner_copyright.py
      - .github/workflows/install-owner-copyright.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add rights notice to main app
        run: python3 scripts/install_owner_copyright.py
      - name: Commit update
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Display author rights in main application"
            git push
          fi
