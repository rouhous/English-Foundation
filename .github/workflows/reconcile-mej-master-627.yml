name: Reconcile and restore 627 legacy master vocabulary words
on:
  push:
    paths:
      - 'scripts/reconcile_mej_master_627.cjs'
      - 'scripts/master-627-stage-manifest.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconcile original master to current 12 approved image banks
        run: |
          mkdir -p reviews/quality-audit
          node --max-old-space-size=3072 scripts/reconcile_mej_master_627.cjs > /tmp/legacy-627-log.txt 2>&1 || echo "ERROR" > /tmp/legacy-627-failed
          cat /tmp/legacy-627-log.txt
          cp /tmp/legacy-627-log.txt reviews/quality-audit/master-627-install-log.txt
      - name: Commit result and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reviews/quality-audit/
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile original 627 vocabulary terms; record installed words or errors"
            git push
          fi
      - name: Fail if unresolved
        run: |
          if [ -f /tmp/legacy-627-failed ]; then
            echo "Vocabulary reconciliation failed. Diagnostic committed to reviews/quality-audit/master-627-install-log.txt"
            exit 1
          fi
