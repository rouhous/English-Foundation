name: Extract learning function
on:
  push:
    paths: ['scripts/extract_learning_function.cjs']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/extract_learning_function.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/quality-audit/learning-function.txt
          git diff --cached --quiet || (git commit -m "Inspect learning screen function" && git push)
