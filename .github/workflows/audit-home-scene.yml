name: Audit My English Journey home artwork
on:
  push:
    paths:
      - scripts/audit_home_scene.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit_home_scene.py
      - name: Publish diagnosis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/home-scene.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record home-scene DOM and CSS audit"
            git push
          fi
