name: Install approved vocabulary images 145-208
on:
  push:
    paths:
      - 'assets/import/MEJ_Batches_10-13_145-208_64images_384.zip'
      - 'scripts/install_mej_batches_10_13.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - name: Verify and install 64 vocabulary images
        run: python scripts/install_mej_batches_10_13.py
      - name: Commit pictures and update full image audit
        run: |
          node scripts/audit_missing_vocab_images.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mej-batches-10-13 assets/approved-images-12.js reviews/image-audit
          if ! git diff --cached --quiet; then
            git commit -m "Install vocabulary images 145-208 and refresh missing-image report"
            git push
          fi
