name: Verify learning review images and cache refresh
on:
  push:
    paths:
      - 'scripts/check_learning_review_images.cjs'
      - 'reviews/learning.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate review page scripts, service worker, and approved image paths
        run: |
          node scripts/check_learning_review_images.cjs
          mkdir -p reviews/image-audit
          echo '{"status":"PASS","checks":"review script, offline service worker, image paths for mother father friend lip hip career chapter novel","cacheStrategy":"network-first-with-offline-fallback"}' > reviews/image-audit/learning-review-refresh-check.json
      - name: Record verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/image-audit/learning-review-refresh-check.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify review image fixes"
            git push
          fi
