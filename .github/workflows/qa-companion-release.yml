name: Check safe 2D student companion
on:
  push:
    paths:
      - scripts/qa_companion_release.py
      - .github/workflows/qa-companion-release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/qa_companion_release.py
