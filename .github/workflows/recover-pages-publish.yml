name: Publish My English Journey site (recovery)
on:
  push:
    paths:
      - .github/workflows/recover-pages-publish.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mej-recovery-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify teacher portal and assemble small publish artifact
        run: |
          set -eu
          test -s index.html
          test -s reviews/teacher-portal.html
          test -s reviews/owner-login.html
          test -s reviews/activate.html
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest mobile-home-fix.css _site/
          cp icon-*.png _site/
          cp -a assets reviews _site/
          touch _site/.nojekyll
          printf 'Recovery package: '
          du -sh _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload minimal Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
          error_count: 20
