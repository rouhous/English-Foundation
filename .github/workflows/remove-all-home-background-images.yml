name: Publish home layout without background pictures
on:
  push:
    paths:
      - scripts/remove_all_home_background_images.py
      - .github/workflows/remove-all-home-background-images.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Remove all home-scene pictures and align buttons
        run: python3 scripts/remove_all_home_background_images.py
      - name: Verify HTML and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf8')
          assert s.count('MEJ_HOME_IMAGE_FREE_PREVIEW_20261106')==1
          assert 'class="m31-sea"' not in s
          assert 'class="m31-logos"' in s
          assert 'onclick="openJourneySettings()"' in s
          assert 'onclick="letsGo()"' in s
          for i,code in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)):
            if code.strip():Path('/tmp/mej-clean-'+str(i)+'.js').write_text(code,encoding='utf8')
          PY
          for f in /tmp/mej-clean-*.js; do node --check "$f"; done
      - name: Commit image-free official home
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Remove all home artwork and fit controls within mobile viewport"
            git push
          fi
