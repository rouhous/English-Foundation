const ART=window.MEJHiddenArt;const PHOTO=window.MEJRealPhotoScenes;const el=id=>document.getElementById(id);
let session=null,completed=false,lastClick=0,lastTime=0,timerHandle=null,photoScene=null,lastPhotoMiss=null,practiceOnly=false,previewCandidate=null,reviewMessage="";
let words=ART.words,images=ART.images;
const GUIDE_EMOJI=['🍎','📚','✏️','🍌','🐚','🪢','🗝️','🍊','🧭','🏮','🍼','🗺️','🔔','🔭','🛶','👝'];

const GUIDE_ICONS={
apple:'🍎',book:'📖',pencil:'✏️',banana:'🍌',shell:'🐚',rope:'🪢',key:'🗝️',orange:'🍊',compass:'🧭',lantern:'🏮',bottle:'🍼',map:'🗺️',bell:'🔔',telescope:'🔭',oar:'🛶',pouch:'👝',

function visualCue(word,id){
 const name=String(word||'').trim().toLowerCase().replace(/\s+/g,' ');
 return GUIDE_ICONS[name]||(name===ART.words[id]?GUIDE_EMOJI[id]:null);
}
let guideMode='word';
function guideFor(id){
 if(guideMode==='word')return null;
 const art=document.createElement('span');art.className='guide-art';
 art.setAttribute('aria-hidden','true');
 // Use the exact target artwork for the picture/outline cues: no unrelated emojis.
 const img=document.createElement('img');
 img.src=images[id];img.alt='';img.loading='lazy';
 if(guideMode==='silhouette'){img.style.filter='brightness(0)';img.style.opacity='.9';}
 img.onerror=()=>{img.remove();const cue=visualCue(words[id],id);if(cue){const fallback=document.createElement('span');fallback.className='guide-emoji';fallback.textContent=cue;if(guideMode==='silhouette')fallback.style.filter='brightness(0)';art.append(fallback)}};
 art.append(img);return art;
}

function draftCue(id){
 if(guideMode==='word')return null;
 const candidate=photoScene?.targets?.[id],poly=candidate?.regions?.[0];
 if(!photoScene?.reviewSource||!Array.isArray(poly)||poly.length<3)return null;
 const shell=document.createElement('span');shell.className='guide-art draft-guide';shell.setAttribute('aria-hidden','true');
 const x=poly.map(p=>p[0]),y=poly.map(p=>p[1]);
 const x0=Math.min(...x),x1=Math.max(...x),y0=Math.min(...y),y1=Math.max(...y);
 const regionW=Math.max(8,x1-x0),regionH=Math.max(8,y1-y0);
 const scale=Math.min(35/regionW,35/regionH)*.82;
 const offX=(35-regionW*scale)/2,offY=(35-regionH*scale)/2;
 const mask=document.createElement('span');mask.className='draft-guide-image';
 mask.style.backgroundImage='url("'+photoScene.file+'")';
 mask.style.backgroundSize=(1599*scale)+'px '+(900*scale)+'px';
 mask.style.backgroundPosition=(offX-x0*scale)+'px '+(offY-y0*scale)+'px';
 if(guideMode==='silhouette'){
   const pts=poly.map(([px,py])=>((offX+(px-x0)*scale)/35*100).toFixed(2)+'% '+((offY+(py-y0)*scale)/35*100).toFixed(2)+'%').join(',');
   mask.style.clipPath='polygon('+pts+')';mask.style.filter='brightness(0)';
 }
 shell.append(mask);return shell;
}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const shuffle=(arr,seed)=>{let t=seed>>>0;const rand=()=>{t=(Math.imul(t,1664525)+1013904223)>>>0;return t/4294967296};const a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// V5 teacher-verified polygon hit geometry; allow every visible instance.
function polyInside(x,y,p){let hit=false;for(let i=0,j=p.length-1;i<p.length;j=i++){
 const a=p[i],b=p[j];if(((a[1]>y)!==(b[1]>y))&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])hit=!hit
 }return hit}
function polyDistance(x,y,p){if(polyInside(x,y,p))return 0;let min=Infinity;
 for(let i=0;i<p.length;i++){let a=p[i],b=p[(i+1)%p.length],dx=b[0]-a[0],dy=b[1]-a[1];
 let t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/Math.max(1,dx*dx+dy*dy)));
 min=Math.min(min,Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy))}
 return min}
function photoHit(px,py){if(!photoScene)return -1;const w=Math.max(300,el('scene').clientWidth),tolerance=Math.min(17,Math.max(6,10/Math.max(.3,w/1599))),found=new Set(session.found);
 const options=[];
 photoScene.targets.forEach((target,i)=>{
  const polys=target.regions||[];
  const d=Math.min(...polys.map(poly=>polyDistance(px,py,poly)));
  if(d<=tolerance){
   const center=Math.min(...polys.map(poly=>{
    const cx=poly.reduce((n,p)=>n+p[0],0)/poly.length,cy=poly.reduce((n,p)=>n+p[1],0)/poly.length;
    return Math.hypot(px-cx,py-cy);
   }));
   options.push({i,d,center,done:found.has(session.targets[i])});
  }
 });
 // Adjacent school objects may have touching candidate rectangles.
 // The nearest object centre breaks ties, avoiding arbitrary source-order picks.
 options.sort((a,b)=>a.d-b.d||a.center-b.center||Number(a.done)-Number(b.done));
 // Do not let tapping the same found object collect a neighbouring target.
 if(options[0]?.done)return -2;
 return options[0]?.i??-1;
}
function board(){
 const field=el('scene');field.replaceChildren();field.className='scene mode-'+guideMode;
 if(photoScene){
   field.classList.add('photo-active');field.style.backgroundImage='none';
   const canvas=document.createElement('div');canvas.className='photo-board';
   canvas.style.backgroundImage='url("'+(photoScene.reviewSource?photoScene.file:PHOTO.root+photoScene.file)+'")';
   const review=new URLSearchParams(location.search).get('debug')==='hotspots';
   if(review){
     const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
     svg.setAttribute('viewBox','0 0 1599 900');svg.setAttribute('preserveAspectRatio','none');
     svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
     photoScene.targets.forEach((t,i)=>{for(const region of t.regions||[]){
       const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');
       p.setAttribute('points',region.map(pt=>pt.join(',')).join(' '));
       p.setAttribute('fill','#edc42a23');p.setAttribute('stroke','#edc42a');p.setAttribute('stroke-width','3');svg.append(p);
     }});canvas.append(svg);
   }
   if(previewCandidate&&!photoScene.targets?.length){const msg=document.createElement('div');msg.className='precision-pending';msg.textContent=reviewMessage;canvas.append(msg);}
   // A small tick appears by the object's edge only AFTER it has been found.
   photoScene.targets.forEach((target,i)=>{
     if(!session.found.includes(session.targets[i]))return;
     const poly=target.regions?.[0];if(!Array.isArray(poly)||!poly.length)return;
     const xs=poly.map(pt=>pt[0]),ys=poly.map(pt=>pt[1]);
     const x=clamp(Math.max(...xs)-9,14,1585),y=clamp(Math.min(...ys)+10,14,886);
     const check=document.createElement('span');check.className='photo-found-check';check.textContent='✓';
     check.style.left=(x/1599*100)+'%';check.style.top=(y/900*100)+'%';
     canvas.append(check);
   });
   canvas.addEventListener('click',ev=>{
     if(completed||previewCandidate&&!photoScene.targets?.length)return;
     const rect=canvas.getBoundingClientRect(),px=(ev.clientX-rect.left)*1599/rect.width,py=(ev.clientY-rect.top)*900/rect.height;
     if(!Number.isFinite(px)||!Number.isFinite(py)||px<0||py<0||px>1599||py>900)return;
     const picked=photoHit(px,py);
     if(picked===-2){el('notice').textContent='✅ لقد عثرت على هذا الغرض بالفعل. ابحث عن الغرض التالي.';return}
     if(picked>=0){lastPhotoMiss=null;if(!session.found.includes(session.targets[picked]))tap(session.targets[picked]);return}
     const now=Date.now();if(lastPhotoMiss&&now-lastPhotoMiss.at<4000&&Math.hypot(px-lastPhotoMiss.x,py-lastPhotoMiss.y)<42){
       el('notice').textContent='حاول لمس جزء آخر من الغرض أو تكبير الصورة';return;
     }
     lastPhotoMiss={x:px,y:py,at:now};wrong();
   });
   field.append(canvas);renderListAndScores();return;
 }
 const backgrounds=ART.scenes||[ART.background],view=backgrounds[session.scene%backgrounds.length];
 field.style.backgroundImage='linear-gradient(0deg,#2943341c,#d3bc8a0d),url("'+view+'")';
 const choices=shuffle(words.map((_,i)=>i).filter(i=>i!==6),session.seed);
 const positions=shuffle(Array.from({length:15},(_,i)=>({
  x:9+(i%5)*20+(i%3)*2.1,y:15+Math.floor(i/5)*32+(i%4)*1.8
 })),session.seed+91);
 choices.forEach((id,i)=>{if(session.found.includes(id))return;
  const item=document.createElement('button');item.type='button';item.className='spot';
  item.style.left=positions[i].x+'%';item.style.top=positions[i].y+'%';
  item.style.transform='translate(-50%,-50%) rotate('+(((i*7+session.seed)%29)-14)+'deg) scale('+(.82+(i%5)*.06)+')';
  item.setAttribute('aria-label','Object '+(i+1));item.dataset.item=id;
  const img=document.createElement('img');img.src=images[id];img.alt='';item.append(img);
  item.addEventListener('click',ev=>{ev.stopPropagation();tap(id)});field.append(item);
 });

 renderListAndScores();
}
function renderListAndScores(){
 const list=el('words');list.replaceChildren();
 for(const id of session.targets){
   const li=document.createElement('li'),done=session.found.includes(id);
   li.className=(done?'found ':'')+(guideMode==='picture'?'guide-picture':guideMode==='silhouette'?'guide-silhouette':'guide-word-only');
   const guide=photoScene?.reviewSource?draftCue(id):guideFor(id);if(guide)li.append(guide);
   const label=document.createElement('span');label.textContent=(done?'✓ ':'')+words[id];li.append(label);list.append(li);
 }

 el('stage').textContent='الجزيرة '+session.stage+' · الشارة '+session.badge;
 el('found').textContent=session.found.length+' / '+(previewCandidate?Math.max(0,session.targets.length):10);
 el('bonus').textContent=(practiceOnly?'🎯 ':'⭐ ')+Math.floor(session.found.length/2)+'/5'+(practiceOnly?' تدريب':'');
 el('mistakes').textContent='❤️'.repeat(Math.max(0,3-session.misses))+'🖤'.repeat(session.misses);
}
function send(done){parent.postMessage({type:'mej:hidden-progress',stage:session.stage,badge:session.badge,found:[...session.found],misses:session.misses,remaining:session.remaining,ended:!!done},location.origin)}
function tap(id){if(completed)return;const now=Date.now();if(now-lastClick<330)return;lastClick=now;
 if(!session.targets.includes(id)){wrong(true);return}
 if(session.found.includes(id))return;
 session.found.push(id);el('notice').textContent='Excellent! '+words[id]+' ✓';
 if(session.found.length===10){finish('all');return}
 send(false);board();
}
function wrong(item){if(completed)return;const now=Date.now();if(now-lastClick<330&&!item)return;lastClick=now;
 session.misses=Math.min(3,session.misses+1);
 el('notice').textContent='Try again! خطأ '+session.misses+' من 3';
 if(session.misses>=3){finish('mistakes');return}send(false);board();
}
function finish(reason){if(completed)return;completed=true;clearInterval(timerHandle);session.ended=true;send(true);board();
 const award=Math.floor(session.found.length/2);
 const rewardLabel=practiceOnly?'<strong>🎯 '+award+' / 5 نقاط تدريب</strong><p>لا تُضاف نجوم إلى حساب الطالب</p>':'<strong>+'+award+' ⭐</strong><p>نجمة لكل غرضين صحيحين</p>';
 const box=document.createElement('div');box.className='end';box.innerHTML='<div class="end-card"><h2>'+(reason==='all'?'أحسنت! اكتملت الجولة 🎉':reason==='mistakes'?'انتهت المحاولات الثلاث':'انتهى الوقت')+'</h2><p>جمعت '+session.found.length+' من 10 أغراض</p>'+rewardLabel+'<button class="back" id="closeGame">العودة إلى رحلتي</button></div>';
 el('scene').append(box);el('closeGame').onclick=()=>parent.postMessage({type:'mej:hidden-close'},location.origin);
}
function tick(){if(!session||completed||session.remaining==null)return;const now=Date.now();const diff=clamp(Math.floor((now-lastTime)/1000),0,8);if(diff){lastTime=now;session.remaining=Math.max(0,session.remaining-diff);const sec=session.remaining;el('timer').textContent='⏱️ '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(sec<=0){finish('timeout');return}if(sec%10===0)send(false)}}
window.addEventListener('message',e=>{if(window.parent===window||e.origin!==location.origin||e.source!==window.parent||e.data?.type!=='mej:hidden-init'||session)return;
 const d=e.data;
 practiceOnly=d.practice===true||d.preview===true;
 // Stage is the learner's actual island level, not merely their registered grade.
 const phase=Math.max(0,Math.min(12,Math.floor(Number(d.stage)||0)));
 guideMode=phase<=4?'picture':phase<=8?'silhouette':'word';
 el('instruction').textContent=guideMode==='picture'?'🔎 ابحث عن 10 أغراض بمساعدة صورها. ثلاث محاولات للأخطاء.':guideMode==='silhouette'?'🔎 ابحث عن 10 أغراض بمساعدة الظلال والكلمات. ثلاث محاولات للأخطاء.':'🔎 اقرأ الكلمات الإنجليزية وحدد 10 أغراض داخل المشهد. ثلاث محاولات للأخطاء.';
 if(Array.isArray(d.items)&&d.items.length===16){
   words=ART.words.map((word,i)=>typeof d.items[i]?.word==='string'?d.items[i].word:word);
   images=ART.images.map((src,i)=>typeof d.items[i]?.src==='string'&&/^(data:image\/|\.\.?\/assets\/)/i.test(d.items[i].src)?d.items[i].src:src);
 }
 const all=words.map((_,i)=>i).filter(i=>i!==6);
 const seed=Number(d.stage)*7919+Number(d.badge)*1013;
 const proposed=shuffle(all,seed).slice(0,10);const saved=d.saved||{};
 session={stage:d.stage,badge:d.badge,seed,scene:d.scene||0,targets:proposed,
  found:Array.isArray(saved.found)?saved.found.filter(x=>proposed.includes(x)).slice(0,10):[],
  misses:clamp(Number(saved.misses)||0,0,3),remaining:saved.remaining==null?null:clamp(Math.floor(Number(saved.remaining)||0),0,180),ended:false};
 if(session.remaining==null)el('timer').textContent='⏱️ بدون مؤقت';
 else{el('timer').textContent='⏱️ '+Math.floor(session.remaining/60)+':'+String(session.remaining%60).padStart(2,'0');el('timerToggle').disabled=true;}
 // When the photo files are installed the objects are searched in the
 // original illustration, not as separate floating sprites.
 const scenes=PHOTO?.scenes||[];
 // Fail closed: unapproved scenes are review-only, not playable for student stars.
 // Scene targets must correspond to nine really mastered curriculum words and
 // exactly one curriculum challenge word; never replace a live list with random words.
 const norm=w=>String(w||'').toLowerCase().trim().replace(/\s+/g,' ');
 const known=new Set((Array.isArray(d.masteredWords)?d.masteredWords:[]).map(norm));
 const level=new Set((Array.isArray(d.levelWords)?d.levelWords:[]).map(norm));
 const mapped=scenes.find(sc=>sc.approved===true&&sc.stage===Number(d.stage)&&sc.badge===Number(d.badge)&&sc.targets?.length===10
   &&sc.targets.every(t=>Array.isArray(t.regions)&&t.regions.length)
   &&sc.targets.filter(t=>known.has(norm(t.word))).length===9
   &&sc.targets.filter(t=>!known.has(norm(t.word))&&level.has(norm(t.word))).length===1)||null;
 const candidate=window.MEJPrecisionLibrary?.sceneSlots?.find(s=>s.stage===phase&&s.badge===Number(d.badge))||null;
 previewCandidate=!mapped?candidate:null;
 const previewAccess=practiceOnly&&(d.preview===true||d.practice===true);
 const estimate=previewCandidate?.assetId?window.MEJPrecisionLibrary?.hotspots?.[previewCandidate.assetId]||{}:{};
 const provisional=Object.entries(estimate).filter(([w,v])=>Array.isArray(v.points)&&v.points.length>=3)
  .map(([word,v])=>({word,regions:[v.points.map(([x,y])=>[x*15.99,y*9])]}));
 const reviewPlayable=previewAccess&&provisional.length===10&&new Set(provisional.map(t=>t.word)).size===10&&!!previewCandidate?.image;
 const start=()=>{
   if(photoScene?.targets?.length===10){
     session.targets=Array.from({length:10},(_,i)=>i);
     words=ART.words.slice();for(let i=0;i<10;i++)words[i]=photoScene.targets[i].word;
   }else if(previewCandidate){session.targets=[];session.remaining=null;}
   board();
   if(reviewPlayable&&session.targets.length===10){el('notice').textContent='✅ اللعبة مفعّلة: ابحث عن الأغراض العشرة داخل الصورة. تُحتسب نقاط تدريب فقط دون منح نجوم.';}
   if(previewCandidate&&session.targets.length===0){el('notice').textContent=reviewMessage;el('timerToggle').hidden=true;return;}
   if(session.misses>=3||session.found.length===10||session.remaining===0){
     finish(session.found.length===10?'all':session.misses===3?'mistakes':'timeout');return;
   }
   lastTime=Date.now();if(session.remaining!=null)timerHandle=setInterval(tick,1000);
 };
 if(mapped&&mapped.targets.length===10){
   const img=new Image();img.onload=()=>{photoScene=mapped;start()};
   img.onerror=()=>{photoScene=null;start()};
   img.src=PHOTO.root+mapped.file;
 }else if(candidate?.image){
   // Incomplete approval MUST NOT turn draft geometry into a scored student attempt.
   practiceOnly=true;
   photoScene={file:candidate.image,reviewSource:true,targets:reviewPlayable?provisional:[]};
   reviewMessage=previewAccess?'هذا المشهد محفوظ للمراجعة، لكن مناطق أغراضه لم تعتمد بعد. افتح محرر Precision Hotspots لإكمالها.':'هذه الصورة قيد المراجعة التعليمية، وستتاح لعبة البحث بعد اعتماد أغراضها.';
   const img=new Image();img.onload=start;img.onerror=()=>{
     practiceOnly=true;session.targets=[];session.remaining=null;photoScene=null;
     reviewMessage='تعذر تنزيل الصورة الأصلية. لا يمكن تشغيل جولة غير مطابقة دون صورتها.';
     el('notice').textContent=reviewMessage;
     const field=el('scene');field.replaceChildren();field.style.backgroundImage='none';
     const msg=document.createElement('div');msg.className='precision-unavailable';msg.textContent=reviewMessage;field.append(msg);
     el('words').replaceChildren();el('timerToggle').hidden=true;
   };img.src=candidate.image;
 }else{
   practiceOnly=true;previewCandidate={image:null};photoScene=null;session.targets=[];reviewMessage='لا توجد صورة معتمدة لهذا الموضوع بعد. لم تُستخدم صورة غير مناسبة بدلًا منها.';
   el('notice').textContent=reviewMessage;board();
   const field=el('scene');field.replaceChildren();field.style.backgroundImage='none';
   const msg=document.createElement('div');msg.className='precision-unavailable';msg.textContent=reviewMessage;field.append(msg);
   el('words').replaceChildren();el('timerToggle').hidden=true;
 }
});
el('scene').addEventListener('click',ev=>{if(ev.target.closest('.spot,.photo-target,.photo-board,.end'))return;wrong()});
el('timerToggle').onclick=()=>{
 if(!session||completed||session.remaining!=null)return;
 session.remaining=180;lastTime=Date.now();el('timerToggle').disabled=true;
 el('timer').textContent='⏱️ 3:00';el('notice').textContent='بدأ تحدّي الوقت: 3 دقائق. انتهِ قبل انتهاء الوقت!';
 timerHandle=setInterval(tick,1000);send(false);
};
el('back').onclick=()=>parent.postMessage({type:'mej:hidden-close'},location.origin);
parent.postMessage({type:'mej:hidden-ready'},location.origin);
})();
</script></body></html>
