name: Switch Journey badges to Hidden Objects gates
on:
  push:
    paths:
      - 'scripts/install_hidden_badge_gates_20261112.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/install_hidden_badge_gates_20261112.cjs
      - name: Commit checked app layout
        run: |
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js reviews/quality-audit/hidden-badge-gates-20261112.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace sailor panel and images with Hidden Objects badge gates"
            git push
          fi
