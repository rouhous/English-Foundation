name: Install MEJ approved vocabulary batches 04-08
on:
  push:
    paths:
      - 'assets/import/MEJ_5_Batches_49-128_80_Images_384.zip'
      - 'scripts/install_mej_batches_04_08.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-approved-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for image verification
        run: python -m pip install Pillow==11.1.0
      - name: Verify and install curated vocabulary images
        run: python scripts/install_mej_batches_04_08.py
      - name: Commit images and approved-image mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mej-batches-04-08 assets/approved-images-12.js
          if ! git diff --cached --quiet; then
            git commit -m "Install 80 curated vocabulary images and link words 49-128"
            git push
          fi
