name: Hotfix skills page performance
on:
  push:
    paths:
      - scripts/hotfix_skills_performance.py
      - scripts/restore_skills_and_voyage_back.py
      - .github/workflows/hotfix-skills-performance.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python3 scripts/restore_skills_and_voyage_back.py
      - name: Publish updated learner HTML
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix skills and add return to my journey on levels"
            git push
          fi
