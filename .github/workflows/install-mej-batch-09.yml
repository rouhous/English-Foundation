name: Install approved vocabulary images 129-144
on:
  push:
    paths:
      - 'assets/import/MEJ_Batch09_129-144_FOR_REVIEW.zip'
      - 'scripts/install_mej_batch_09.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - name: Verify and install 16 vocabulary images
        run: python scripts/install_mej_batch_09.py
      - name: Commit installed assets and vocabulary mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mej-batch-09-129-144 assets/approved-images-12.js
          if ! git diff --cached --quiet; then
            git commit -m "Install approved vocabulary pictures 129-144"
            git push
          fi
