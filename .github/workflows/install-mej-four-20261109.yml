name: Install 4 approved vocabulary pictures (2026-11-09)
on:
  push:
    paths:
      - 'assets/MEJ_4_Approved_Ready_For_GitHub_2026-11-09.zip'
      - 'assets/import/MEJ_4_Approved_Ready_For_GitHub_2026-11-09.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate approved picture bundle and attach learning mappings
        run: node scripts/install_mej_four_owner_approved_20261109.cjs
      - name: Publish four approved pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mej-approved-four-20261109 assets/approved-images-20.js index.html reviews/learning.html sw.js reviews/image-audit/MEJ_FOUR_APPROVED_20261109_INSTALL_RESULT.json
          git diff --cached --quiet || (git commit -m "Install four owner-approved MEJ pictures and five stage routes" && git push)
