name: Inspect Star Earning Hooks
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect-stars-earning.cjs"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/inspect-stars-earning.cjs
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/stars-earning-hooks-20261120.json
          if ! git diff --staged --quiet; then
            git commit -m "Inspect precise stars award pathways"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
