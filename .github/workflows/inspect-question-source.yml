name: Inspect curriculum question source
on:
  push:
    paths: ['scripts/inspect_question_source.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/inspect_question_source.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/quality-audit/source-inspection.json
          git diff --cached --quiet || (git commit -m "Record question source structure" && git push)
