name: Inspect navigation and UI targets
on:
  push:
    paths:
      - scripts/audit_mej_ui_targets.py
      - .github/workflows/audit-mej-ui-targets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit_mej_ui_targets.py
      - name: Commit audit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/mej-ui-target-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Capture UI route signatures for targeted styling"
            git push
          fi
