name: Install MEJ vocabulary images 209-286
on:
  push:
    paths:
      - 'assets/import/MEJ_Final_Batches_14-18_209-286_78images_384_REVIEW.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install Pillow==11.1.0
      - name: Validate and install 78 vocabulary images
        run: python scripts/install_mej_batches_14_18.py
      - name: Refresh full learning-image coverage audit
        run: node scripts/audit_missing_vocab_images.cjs
      - name: Commit images, mappings, and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mej-batches-14-18 assets/approved-images-12.js reviews/image-audit/
          if ! git diff --cached --quiet; then
            git commit -m "Install images 209-286 and refresh coverage audit"
            git push
          fi
