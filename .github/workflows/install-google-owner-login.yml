name: Connect Admin settings entry to Google login
on:
  push:
    paths:
      - scripts/install_google_owner_login.py
      - .github/workflows/install-google-owner-login.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing settings entry safely
        run: python3 scripts/install_google_owner_login.py
      - name: Confirm no browser-side admin bypass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "const link = './reviews/owner-login.html';" in s
          assert "MEJ_SAFE_ADMIN_SETTINGS_ENTRY_V1" in s
          print("GOOGLE_OWNER_ENTRY_PRESENT")
          PY
      - name: Commit application update
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Route Admin settings to Google owner sign-in"
            git push
          fi
