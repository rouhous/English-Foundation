name: Balance revised Writing MCQs
on:
  push:
    paths:
      - 'scripts/balance_writing_distractors.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: node scripts/balance_writing_distractors.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reviews/admin-levels-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Balance correct answer positions and refine writing options"
            git push
          fi
