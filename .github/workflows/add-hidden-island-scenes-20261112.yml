name: Add distinct island backgrounds to Hidden Objects
on:
  push:
    paths:
      - 'scripts/add_hidden_island_scenes_20261112.cjs'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract four approved island backgrounds
        run: node scripts/add_hidden_island_scenes_20261112.cjs
      - name: Commit scene assets
        run: |
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hidden-objects/assets.js reviews/quality-audit/hidden-scene-backgrounds-20261112.json
          if ! git diff --cached --quiet; then
            git commit -m "Add four distinct existing island scenes to Hidden Objects"
            git push
          fi
