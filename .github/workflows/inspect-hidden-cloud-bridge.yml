name: Inspect Hidden Objects cloud bridge
on:
  push:
    paths: ['scripts/inspect_hidden_cloud_bridge.cjs']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/inspect_hidden_cloud_bridge.cjs
      - run: |
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reviews/quality-audit/hidden-cloud-bridging-source.json
          git commit -m "Inspect cloud snapshot fields for Hidden Objects sync" || true
          git push
