name: Restore skills UI and add voyage back button
on:
  push:
    paths:
      - scripts/restore_skills_and_voyage_back.py
      - .github/workflows/restore-skills-and-voyage-back.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python3 scripts/restore_skills_and_voyage_back.py
      - name: Commit safe site fix
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Restore skills UI and add return to voyage on levels"
            git push
          fi
