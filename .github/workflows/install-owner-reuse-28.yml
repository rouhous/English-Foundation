name: Install owner-approved 28 reusable vocabulary pictures
on:
  push:
    paths:
      - 'scripts/install_owner_approved_28_image_reuse.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Link owner-approved images to learning pages
        run: node scripts/install_owner_approved_28_image_reuse.cjs
      - name: Publish reviewed aliases and result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved-images-14.js index.html sw.js reviews/learning.html reviews/image-audit/MEJ_33_reuse_install_result.json
          git diff --cached --quiet || (git commit -m "Install 28 owner-approved reusable vocabulary images" && git push)
