name: Arcade badge threshold regression
on:
  pull_request:
    paths:
      - 'coastal-arcade/app-bridge.js'
      - 'coastal-arcade/index.html'
      - 'games/coastal-badges.js'
      - 'games/arcade.js'
      - 'boat-game/rewards.js'
      - 'boat-game/index.html'
      - 'supabase/migrations/*arcade_badge_5_star_thresholds.sql'
      - 'supabase/migrations/*migrate_legacy_island_stars_div4.sql'
      - 'tests/arcade-badge-thresholds.test.mjs'
      - 'tests/arcade-star-migration.postgres.sql'
      - '.github/workflows/arcade-badge-thresholds.yml'
  push:
    branches:
      - preview/owner-review-updates
      - fix/arcade-badge-5-star-rpc-20261128
    paths:
      - 'coastal-arcade/app-bridge.js'
      - 'coastal-arcade/index.html'
      - 'games/coastal-badges.js'
      - 'games/arcade.js'
      - 'supabase/migrations/*arcade_badge_5_star_thresholds.sql'
      - 'supabase/migrations/*migrate_legacy_island_stars_div4.sql'
      - 'tests/arcade-badge-thresholds.test.mjs'
      - 'tests/arcade-star-migration.postgres.sql'
      - '.github/workflows/arcade-badge-thresholds.yml'
jobs:
  thresholds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check coastal-arcade/app-bridge.js
      - run: node --check games/coastal-badges.js
      - run: node --check games/arcade.js
      - run: node --input-type=module --check < boat-game/rewards.js
      - run: node --test tests/arcade-badge-thresholds.test.mjs

  legacy-migration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: migration_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute migration twice against disposable PostgreSQL fixtures
        run: psql -v ON_ERROR_STOP=1 -f tests/arcade-star-migration.postgres.sql
