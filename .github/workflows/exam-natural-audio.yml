name: Generate natural multi-voice exam listening audio

on:
  push:
    paths:
      - '.github/workflows/exam-natural-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exam-natural-audio
  cancel-in-progress: false

jobs:
  synthesize:
    name: Grade ${{ matrix.grade }} · Kokoro voices
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        grade: [5, 6, 7, 8, 9, 10, 11, 12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro-82M open-source TTS
        run: python -m pip install kokoro-onnx soundfile numpy
      - name: Download free pretrained English voices and model
        run: |
          mkdir -p models
          curl -fL --retry 4 --retry-delay 3 -o models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.fp16.onnx
          curl -fL --retry 4 --retry-delay 3 -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Verify all five-grade illustrated listening tasks before narration
        run: python scripts/audit_listening_pictures.py
      - name: Synthesize this grade with natural multi-speaker voices
        env:
          GRADE: ${{ matrix.grade }}
        run: python -u scripts/generate_exam_natural_audio.py --grade "$GRADE" --force
      - name: Collect and verify generated MP3s
        env:
          GRADE: ${{ matrix.grade }}
        run: |
          mkdir -p build-audio
          python - <<'PY'
          import os,re,json,shutil,subprocess
          from pathlib import Path
          g=int(os.environ['GRADE'])
          s=Path('exam-practice/index.html').read_text(encoding='utf8')
          data=json.loads(re.search(r'<script id="activityData" type="application/json">([\s\S]*?)</script>',s).group(1))
          arr=[a for a in data['activities'] if a.get('grade')==g and a.get('skill')=='listening']
          assert len(arr)>=8,(g,len(arr))
          for a in arr:
              src=Path('exam-practice')/a['audio']
              assert src.is_file() and src.stat().st_size>=10000,(a['id'],str(src))
              duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(src)],text=True))
              assert duration>=25,(a['id'],duration)
              shutil.copy2(src,Path('build-audio')/src.name)
              print(a['id'],round(duration,1),'seconds',src.stat().st_size,'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exam-audio-grade-${{ matrix.grade }}
          path: build-audio/*.mp3
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: exam-audio-grade-*
          path: exam-practice/audio
          merge-multiple: true
      - name: Validate all 80 recordings and update exercise bank
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,subprocess
          p=Path('exam-practice/index.html')
          s=p.read_text(encoding='utf8')
          m=re.search(r'(<script id="activityData" type="application/json">)([\s\S]*?)(</script>)',s)
          assert m
          data=json.loads(m.group(2))
          audios=[a for a in data['activities'] if a.get('skill')=='listening']
          assert len(audios)==80,len(audios)
          for a in audios:
              path=Path('exam-practice')/a['audio']
              if not path.exists() or path.stat().st_size<10000:raise RuntimeError('Missing audio '+a['id'])
              duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(path)],text=True))
              if duration<25:raise RuntimeError('Suspiciously short '+a['id'])
              a['audioReady']=True
          s=s[:m.start()]+m.group(1)+json.dumps(data,indent=2,ensure_ascii=False)+m.group(3)+s[m.end():]
          p.write_text(s,encoding='utf8')
          print('Verified 80 natural recordings, all marked ready')
          PY
      - name: Publish local MP3 files to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam-practice/audio/ exam-practice/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish 80 natural multi-voice listening recordings for exam practice"
            git push
          fi
