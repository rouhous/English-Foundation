name: Install safe approved Omani companion
on:
  push:
    paths:
      - scripts/install_safe_companion_live.py
      - .github/workflows/install-safe-companion-live.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python3 scripts/install_safe_companion_live.py
      - name: Save verified student-page integration
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Enable approved lightweight companion chooser and praise animations"
            git push
          fi
