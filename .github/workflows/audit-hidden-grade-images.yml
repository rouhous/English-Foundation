name: Audit grade vocabulary image resolver
on:
  push:
    paths: ['scripts/audit_hidden_grade_images.cjs']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit_hidden_grade_images.cjs
      - run: |
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reviews/quality-audit/hidden-grade-images-snip.json
          git commit -m "Inspect actual grade image mapping for Hidden Objects" || true
          git push
