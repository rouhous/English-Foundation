name: Restore MEJ Student Landing Before Install Hint
on:
  push:
    branches: [main]
    paths: ['scripts/revert_student_install_hint.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-student-home
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only student install hint markup and layout override
        run: python scripts/revert_student_install_hint.py
      - name: Check restored structure
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'mej-student-install-hint' not in s
          assert 'id="mej-owner-rights-notice"' in s
          assert 'm31-start' in s
          print('HOME_RESTORED_WITH_RIGHTS_AND_START_PRESERVED')
          PY
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "Remove student install instructions and restore original landing layout"
            git push
          fi
