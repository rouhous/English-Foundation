name: Audit student mastery for Hidden Objects
on:
  push:
    paths: ['scripts/audit_student_mastery_for_hidden_20261112.cjs']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit_student_mastery_for_hidden_20261112.cjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reviews/quality-audit/student-mastered-vocabulary-hooks-20261112.json
          if ! git diff --cached --quiet; then git commit -m "Audit safe mastery hooks for nine-word Hidden Objects selection"; git push; fi
