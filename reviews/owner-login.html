<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<title>تسجيل الدخول — رحلتي مع الإنجليزية</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf5ef;color:#164937;font-family:system-ui,'Segoe UI',sans-serif;padding:16px}
main{width:100%;max-width:480px;padding:30px 22px;background:white;border:1px solid #d7e8dd;border-radius:20px;box-shadow:0 9px 28px #154d3515;text-align:center}
h1{font-size:clamp(22px,5vw,27px);margin:0 0 22px}
#googleButton{min-height:46px;margin:14px auto;display:flex;justify-content:center;direction:ltr}
#status{font-size:14px;line-height:1.8;min-height:26px;color:#466257}
#privateArea[hidden]{display:none!important}
#privateArea{margin-top:20px;padding:15px;background:#eff8f2;border-radius:12px;text-align:right}
#privateArea a{display:inline-flex;padding:10px 14px;border-radius:10px;background:#17664d;color:white;text-decoration:none}
a.back{display:inline-block;color:#315d4b;text-decoration:none;margin-top:16px}
#teacherPanel[hidden]{display:none!important}
#teacherPanel{margin-top:16px;padding:14px;background:#f7faf8;border:1px solid #d1e2d6;border-radius:12px;text-align:right}
#teacherPanel label{display:block;font-weight:650;margin-bottom:8px}
#teacherEmail{display:block;width:100%;min-height:45px;border-radius:9px;border:1px solid #b9cfc2;padding:10px;font:inherit;direction:ltr;text-align:left}
#approveTeacher{min-height:44px;margin-top:10px;padding:10px 14px;border:0;border-radius:9px;color:white;background:#17664d;font:inherit;font-weight:650;cursor:pointer}
#approveTeacher:disabled{opacity:.5;cursor:wait}
#teacherStatus{min-height:25px;font-size:13px;line-height:1.7;color:#466257}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main>
<h1>تسجيل الدخول</h1>
<div id="googleButton"></div>
<p id="status" role="status" aria-live="polite">جار تحميل تسجيل الدخول...</p>
<section id="privateArea" hidden>
 <p>تم التحقق من هوية المالك.</p>
 <a id="reviewLink" href="owner-review.html" hidden>مراجعة المحتوى</a>
</section>
<section id="teacherPanel" hidden>
 <label for="teacherEmail">اعتماد بريد معلم للمرحلة التجريبية</label>
 <input type="email" id="teacherEmail" autocomplete="email" placeholder="teacher@example.com" maxlength="150">
 <button id="approveTeacher" type="button">اعتماد المعلم</button>
 <p id="teacherStatus" role="status" aria-live="polite"></p>
</section>
<a class="back" href="../">العودة</a>
</main>
<script>
'use strict';
(()=>{
const CLIENT_ID='825380653679-o9dn1pl3m19olr8de2edjl0hcnngm961.apps.googleusercontent.com';
// The backend must be deployed over HTTPS and bound to a verified owner sub
// before this page can show any private controls. Do not trust decoded JWTs.
const BACKEND_ENDPOINT='https://xboracsbzikojobumcke.supabase.co/functions/v1/mej-owner-verify';
const status=document.getElementById('status');
const privateArea=document.getElementById('privateArea');
const reviewLink=document.getElementById('reviewLink');
const teacherPanel=document.getElementById('teacherPanel');
const teacherStatus=document.getElementById('teacherStatus');
let ownerCredential=null;
function say(s){status.textContent=s}
function deny(){privateArea.hidden=true;reviewLink.hidden=true;teacherPanel.hidden=true;ownerCredential=null}
async function onCredential(response){
 deny();
 if(!response||typeof response.credential!=='string'){say('تعذر تسجيل الدخول.');return}
 if(!BACKEND_ENDPOINT){say('تعذر التحقق من الحساب حاليًا.');return}
 try{
  const endpoint=new URL(BACKEND_ENDPOINT);
  if(endpoint.protocol!=='https:')throw Error('HTTPS_REQUIRED');
  const result=await fetch(endpoint.href,{
   method:'GET',mode:'cors',cache:'no-store',credentials:'omit',
   headers:{Authorization:'Bearer '+response.credential}
  });
  if(!result.ok){say('هذا الحساب غير مخول بالدخول.');return}
  const data=await result.json();
  if(data.ok!==true||data.role!=='owner'||data.email!=='rouhous@gmail.com'){
   say('هذا الحساب غير مخول بالدخول.');return
  }
  ownerCredential=response.credential;
  privateArea.hidden=false;
  teacherPanel.hidden=false;
  if(Array.isArray(data.capabilities)&&data.capabilities.includes('content_review')){
   reviewLink.hidden=false;
  }
  say('');
 }catch(_){deny();say('تعذر التحقق من الحساب حاليًا.')}
}
document.getElementById('approveTeacher').addEventListener('click',async()=>{
 if(!ownerCredential)return;
 const email=document.getElementById('teacherEmail').value.trim();
 if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)){
  teacherStatus.textContent='أدخل بريد المعلم بصورة صحيحة.';return;
 }
 const btn=document.getElementById('approveTeacher');
 btn.disabled=true;teacherStatus.textContent='جار التحقق من الاعتماد...';
 try{
  const resp=await fetch('https://xboracsbzikojobumcke.supabase.co/functions/v1/mej-pilot-teacher-approve',{
   method:'POST',mode:'cors',cache:'no-store',credentials:'omit',
   headers:{'Authorization':'Bearer '+ownerCredential,'Content-Type':'application/json'},
   body:JSON.stringify({teacherEmail:email}),signal:AbortSignal.timeout(12000)
  });
  const data=await resp.json();
  if(resp.status===409)teacherStatus.textContent='اكتمل التسجيل في المرحلة التجريبية.';
  else if(resp.ok&&data.ok===true)teacherStatus.textContent=data.existing?'هذا المعلم معتمد سابقًا.':'تم حجز مقعد للمعلم بنجاح.';
  else teacherStatus.textContent='تعذر اعتماد المعلم. أعد تسجيل الدخول ثم حاول مجددًا.';
 }catch(_){teacherStatus.textContent='تعذر الاتصال بخدمة الاعتماد.'}
 finally{btn.disabled=false}
});

let attempts=0;
const timer=setInterval(()=>{
 if(window.google?.accounts?.id){
  clearInterval(timer);
  try{
   google.accounts.id.initialize({
    client_id:CLIENT_ID,callback:onCredential,auto_select:false,
    cancel_on_tap_outside:true
   });
   google.accounts.id.renderButton(document.getElementById('googleButton'),{
    type:'standard',theme:'outline',size:'large',text:'signin_with',
    shape:'pill',width:270
   });
   say('');
  }catch(_){say('تعذر تحميل تسجيل الدخول.')}
 }else if(++attempts>50){clearInterval(timer);say('تأكد من اتصال الإنترنت.')}
},200);
})();
</script>
</body>
</html>
