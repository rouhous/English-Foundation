name: Stage 5 actual browser viewport smoke
on:
  push:
    paths:
      - scripts/run_stage5_browser_qa.py
      - scripts/stage5-viewport-harness.html
      - .github/workflows/stage5-browser-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check Chrome availability and run page smoke
        run: |
          python3 scripts/run_stage5_browser_qa.py
      - name: Commit viewport metrics
        if: always()
        run: |
          if [ -f diagnostics/stage5-browser-qa.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/stage5-browser-qa.json
            if ! git diff --cached --quiet; then
              git commit -m "Record Stage 5 Chromium responsive viewport audit"
              git push
            fi
          fi
