name: Publish official app wording
on:
  push:
    paths:
      - scripts/official_release_wording.py
      - .github/workflows/official-release-wording.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/official_release_wording.py
      - name: Validate all inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert s.count('MEJ_PUBLIC_OFFICIAL_RELEASE_20261106')==1
          assert 'My English Journey V36 | STAGING' not in s
          for i,block in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.I|re.S)):
            if block.strip(): Path('/tmp/mej-rel-'+str(i)+'.js').write_text(block)
          PY
          for file in /tmp/mej-rel-*.js; do node --check "$file"; done
      - name: Commit official facing version
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Publish official branding and remove staging banners"
            git push
          fi
