name: Check MEJ Landing Layout Structure
on:
  push:
    branches: [main]
    paths: ['scripts/check_home_layout_structure.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_home_layout_structure.py
