name: Stage 7 Live STAGING Bridge Smoke
on:
  push:
    paths:
      - scripts/test_stage7_live_bridge.py
      - .github/workflows/stage7-live-bridge.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser driver
        run: pip install playwright==1.58.0
      - name: Test existing STAGING bridge without student data
        run: python scripts/test_stage7_live_bridge.py
      - name: Save read-only result
        if: always()
        run: |
          if [ -f diagnostics/stage7-live-bridge-check.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/stage7-live-bridge-check.json
            if ! git diff --cached --quiet; then
              git commit -m "Record live STAGING browser handshake test"
              git push
            fi
          fi
