name: Move settings gear beside Let's Go
on:
  push:
    paths:
      - scripts/move_home_settings_gear.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/move_home_settings_gear.py
      - name: Verify exactly one working gear and valid JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert s.count('MEJ_SETTINGS_GEAR_BESIDE_START_20261106')==1
          assert s.count('class="m31-settings-near-start"')==1
          assert s.count('onclick="openJourneySettings()"')>=2
          assert 'onclick="letsGo()"' in s
          for i,js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)):
            if js.strip():Path('/tmp/mej-gear-'+str(i)+'.js').write_text(js)
          PY
          for file in /tmp/mej-gear-*.js; do node --check "$file"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Move settings gear beside start away from Ministry logo"
            git push
          fi
