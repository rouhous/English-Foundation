<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تدقيق صور التعلم — رحلتي مع الإنجليزية</title><style>body{font:16px system-ui;margin:0;background:#f3f7f8;color:#173f43}main{max-width:1080px;margin:auto;padding:20px}h1{font-size:25px}section{background:white;border:1px solid #d4e4e5;border-radius:16px;margin:12px 0;padding:15px}button,input,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #aac8c8}button{background:#086c61;color:white;cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.card{padding:12px;border:1px solid #e1e8e9;border-radius:12px}.card img{width:94px;height:94px;object-fit:contain}.muted{color:#667}.red{color:#ad3535}small{display:block}</style><main><h1>تدقيق صور صفحات التعلم</h1><section>هذه مراجعة لربط الصور المعتمدة بمفردات المستويات، ولا تعدّل بيانات الطلاب أو الصور. الكلمات الناقصة لا تُربط بصور بديلة دون اعتماد.<div id="status">جار تحميل الملفات...</div></section><section><div class="controls"><input id="search" placeholder="بحث عن مفردة"><select id="filter"><option value="missing">الصور المفقودة</option><option value="all">جميع المفردات</option><option value="present">الصور الموجودة</option></select><button id="export">تصدير CSV</button></div><p id="stats"></p><div id="cards" class="cards"></div></section></main><script>
const bank=window.MEJ_APPROVED_IMAGES=window.MEJ_APPROVED_IMAGES||{};let catalog,rows=[];
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().trim().replace(/[’‘]/g,"'").replace(/\s+/g,' ');
function findImage(w){const key=norm(w);let a=[];for(const k of [key,key.replace(/-/g,' '),key.replace(/ /g,'-')]){if(bank[k]){a=Array.isArray(bank[k])?bank[k]:[bank[k]];break}}return a.filter(x=>x&&x.src&&x.rejected!==true&&!['rejected','مرفوض'].includes(String(x.status||'').toLowerCase())).sort((a,b)=>Number(!!b.preferred)-Number(!!a.preferred))[0]||null}
function build(){const grouped=new Map();for(const l of catalog.levels)for(const p of l.parts)for(const q of p.questions){const word=norm(q.pictureWord||q.word);if(!word)continue;let r=grouped.get(word);if(!r){r={word,occurrences:0,grades:new Set(),parts:new Set()};grouped.set(word,r)}r.occurrences++;r.grades.add(l.grade);r.parts.add(l.grade+':'+p.part)}
rows=[...grouped.values()].map(x=>({...x,grades:[...x.grades].join('، '),parts:[...x.parts].join('، '),image:findImage(x.word)})).sort((a,b)=>Number(!b.image)-Number(!a.image)||a.word.localeCompare(b.word));draw()}
function draw(){const s=norm(document.getElementById('search').value),f=document.getElementById('filter').value,selected=rows.filter(x=>(f==='all'||(f==='present'?!!x.image:!x.image))&&x.word.includes(s));const n=rows.filter(x=>!x.image).length;document.getElementById('stats').textContent='إجمالي المفردات: '+rows.length+' | المفقودة: '+n+' | الموجودة: '+(rows.length-n)+' | الظاهرة: '+selected.length;document.getElementById('cards').replaceChildren(...selected.slice(0,300).map(x=>{const c=document.createElement('div');c.className='card';const title=document.createElement('b');title.textContent=x.word;const sub=document.createElement('small');sub.textContent='التكرار: '+x.occurrences+' | الصفوف: '+x.grades;const status=document.createElement('small');status.className=x.image?'muted':'red';status.textContent=x.image?'صورة معتمدة مرتبطة':'لا توجد صورة معتمدة مرتبطة';c.append(title,sub,status);if(x.image){const img=document.createElement('img');img.src=x.image.src;img.alt=x.word;img.onerror=()=>{status.textContent='الرابط موجود لكن الصورة لا تُحمّل';status.className='red';img.remove()};c.append(img)}return c}));}
document.getElementById('search').oninput=draw;document.getElementById('filter').onchange=draw;document.getElementById('export').onclick=()=>{const lines=['word,occurrences,grades,parts,image_status',...rows.map(r=>[r.word,r.occurrences,r.grades,r.parts,r.image?'linked':'missing'].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='MEJ-learning-image-audit.csv';a.click();URL.revokeObjectURL(a.href)};
(async()=>{try{for(let i=1;i<=12;i++){const src='../assets/approved-images-'+String(i).padStart(2,'0')+'.js';await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.append(s)})}catalog=await(await fetch('admin-levels-catalog.json',{cache:'no-store'})).json();build();document.getElementById('status').textContent='اكتمل تدقيق البنك المنشور في GitHub (12 ملفًا).'}catch(e){document.getElementById('status').textContent='تعذر تحميل جميع البيانات: '+e.message}})();
</script></html>
