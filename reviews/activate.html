<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>تفعيل رحلتي مع الإنجليزية</title>
<style>*,*:before,*:after{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(145deg,#e3f5ff,#f4ead6);font-family:system-ui,sans-serif;color:#164d69;padding:16px}main{background:#ffffffee;border:1px solid #c9dfe5;border-radius:22px;padding:24px;max-width:440px;width:100%;text-align:center;box-shadow:0 12px 34px #07557826}h1{font-size:23px}p{line-height:1.7}input,button,a{font:inherit}input{width:100%;padding:13px;border:1px solid #8fb6cc;border-radius:12px;text-align:center;direction:ltr}button{width:100%;padding:13px;background:#0f647e;border:0;color:white;border-radius:12px;margin-top:12px;font-weight:700}a{display:inline-block;margin-top:15px;color:#075b78}#status{min-height:28px;font-size:13px}</style></head><body>
<main><h1>رحلتي مع الإنجليزية</h1><p>أدخل رمز المعلم المكوّن من 6 أرقام للارتباط به</p><label for="key">رمز التفعيل</label><input id="key" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9٠-٩]{6}"><button id="activate" type="button">تفعيل التطبيق</button><p id="status" role="status" aria-live="polite"></p><a href="./owner-login.html">دخول المالك بحساب Google</a></main>
<script>
'use strict';
(function(){
const API='https://xboracsbzikojobumcke.supabase.co/functions/v1/mej-license';
const btn=document.getElementById('activate'),status=document.getElementById('status');
async function activate(){
  const code=document.getElementById('key').value.trim().replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776));
  if(!/^[0-9]{6}$/.test(code)){status.textContent='أدخل الأرقام الستة التي أعطاها لك المعلم.';return}
  btn.disabled=true;status.textContent='جار التحقق من الترخيص...';
  try{
   let id=localStorage.getItem('MEJ_STUDENT_DEVICE_REF_V1');
   if(!id){const bytes=crypto.getRandomValues(new Uint8Array(32));id=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('MEJ_STUDENT_DEVICE_REF_V1',id)}
   const response=await fetch(API,{method:'POST',mode:'cors',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'activate_short',code,studentRef:id}),signal:AbortSignal.timeout(12000)});
   const result=await response.json();
   if(response.status===429){status.textContent='محاولات كثيرة. أعد المحاولة بعد ساعة.';return}
   if(response.status===409){status.textContent='اكتمل العدد المرخّص أو هذا الطالب مرتبط بمعلم آخر.';return}
   if(!response.ok||result.ok!==true||!result.accessToken){status.textContent='رمز التفعيل غير صحيح أو غير نشط.';return}
   localStorage.setItem('MEJ_STUDENT_ACCESS_V1',result.accessToken);
   if(result.licenseType==='wadi_2429'){
     localStorage.setItem('MEJ_ASSIGNED_TEACHER_CODE_V1',code);
     if(result.teacherName)localStorage.setItem('MEJ_ASSIGNED_TEACHER_NAME_V1',result.teacherName);
   }else{
     localStorage.removeItem('MEJ_ASSIGNED_TEACHER_CODE_V1');
     localStorage.removeItem('MEJ_ASSIGNED_TEACHER_NAME_V1');
   }
   location.replace('../');
  }catch(_){status.textContent='تعذر التحقق من الترخيص. تأكد من الاتصال بالإنترنت.'}
  finally{btn.disabled=false}
}
btn.addEventListener('click',activate);
document.getElementById('key').addEventListener('keydown',e=>{if(e.key==='Enter')activate()});
})();
</script></body></html>
