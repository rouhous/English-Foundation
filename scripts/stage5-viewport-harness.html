<!doctype html><html lang="en"><head>
<style id="mej-owner-gate-style">html{visibility:hidden!important}</style>
<script id="mej-owner-only-gate">
/* MEJ_OWNER_ONLY_ACCESS_GATE_20261106 */
(function(){
  "use strict";
  const LOGIN='/English-Foundation/reviews/owner-login.html';
  const TOKEN_KEY='MEJ_OWNER_ACCESS_V1';
  const ENDPOINT='https://xboracsbzikojobumcke.supabase.co/functions/v1/mej-owner-verify';
  const timeout=new AbortController();
  const timer=setTimeout(()=>timeout.abort(),6500);
  const token=sessionStorage.getItem(TOKEN_KEY);
  if(!token){
    clearTimeout(timer);
    location.replace(LOGIN);
    return;
  }
  fetch(ENDPOINT,{
    method:'GET',mode:'cors',credentials:'omit',cache:'no-store',
    headers:{Authorization:'Bearer '+token},
    signal:timeout.signal
  }).then(async response=>{
    if(!response.ok)throw Error('OWNER_NOT_AUTHENTICATED');
    const data=await response.json();
    if(data.ok!==true || data.role!=='owner' || data.email!=='rouhous@gmail.com')
      throw Error('OWNER_NOT_AUTHENTICATED');
    window.__MEJ_OWNER_VERIFIED_SESSION=true;
    document.getElementById('mej-owner-gate-style')?.remove();
  }).catch(()=>{
    sessionStorage.removeItem(TOKEN_KEY);
    location.replace(LOGIN);
  }).finally(()=>clearTimeout(timer));
})();
</script>
<meta charset="utf-8"><title>Stage 5 viewport smoke</title></head>
<body><pre id="result">STAGE5_RUNNING</pre><script>
(async()=>{
const sizes=[[320,700],[390,844],[768,1024],[1280,800],[844,390]];
const results=[];
for(const [width,height] of sizes){
 const frame=document.createElement('iframe');
 frame.style.cssText='border:0;display:block;width:'+width+'px;height:'+height+'px;position:absolute;left:-10000px;top:0';
 frame.src='../index.html?stage5_smoke='+width+'x'+height;
 document.body.appendChild(frame);
 await Promise.race([
  new Promise(resolve=>frame.addEventListener('load',()=>setTimeout(resolve,250),{once:true})),
  new Promise(resolve=>setTimeout(resolve,7500))
 ]);
 try{
  const doc=frame.contentDocument,win=frame.contentWindow;
  const app=doc.getElementById('app');
  const buttons=[...doc.querySelectorAll('.navbar .navbutton')];
  results.push({width,height,
   viewport:win.innerWidth,
   overflow:Math.max(0,doc.documentElement.scrollWidth-win.innerWidth),
   hasApp:!!app,appWidth:Math.round(app?.getBoundingClientRect().width||0),
   navCount:buttons.length,
   rankingNav:buttons.some(b=>b.textContent.includes('ترتيب صفي')),
   viewportMeta:!!doc.querySelector('meta[name="viewport"]'),
   responsiveCSS:!!doc.querySelector('link[href*="stage5-responsive.css"]'),
   appChildCount:app?.children.length||0
  });
 }catch(e){results.push({width,height,error:String(e)})}
 frame.remove();
}
document.getElementById('result').textContent='STAGE5_RESULT:'+JSON.stringify(results);
})();
</script></body></html>
