name: Check live teacher portal after successful Pages release
on:
  push:
    paths:
      - .github/workflows/check-live-teacher-portal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Request published pages and verify content
        run: |
          set -eu
          for path in / /reviews/owner-login.html /reviews/teacher-portal.html /reviews/activate.html; do
            code=$(curl -sS -L -o /tmp/page-check.html -w '%{http_code}' --max-time 20 "https://rouhous.github.io/English-Foundation$path")
            echo "$path HTTP $code"
            if [ "$path" = /reviews/teacher-portal.html ] && [ "$code" = 200 ]; then
              grep -q 'بوابة المعلم والمدرسة' /tmp/page-check.html && echo 'TEACHER_PORTAL_LIVE_CONTENT_OK'
              grep -q 'joinSchoolNo' /tmp/page-check.html && echo 'SCHOOL_FOUR_DIGIT_FIELD_LIVE_OK'
              grep -q 'claim_school_teacher' /tmp/page-check.html && echo 'TEACHER_LICENSE_FLOW_LIVE_OK'
            fi
            if [ "$path" = /reviews/activate.html ] && [ "$code" = 200 ]; then
              grep -q 'MEJ_STUDENT_ACCESS_V1' /tmp/page-check.html && echo 'STUDENT_ACTIVATION_LIVE_OK'
            fi
          done
