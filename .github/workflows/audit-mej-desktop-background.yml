name: Audit MEJ Desktop Background Hooks
on:
  push:
    branches: [main]
    paths: ['scripts/audit_mej_desktop_background.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate desktop backdrop selectors
        run: python scripts/audit_mej_desktop_background.py
