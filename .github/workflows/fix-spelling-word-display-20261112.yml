name: Fix spelling word display in all question modes
on:
  push:
    paths:
      - 'scripts/fix_spelling_word_display_20261112.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix spelling prompt selection, test all bank items
        run: node scripts/fix_spelling_word_display_20261112.cjs
      - name: Commit validated student UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reviews/quality-audit/spelling-word-display-v3.json
          if ! git diff --cached --quiet; then
            git commit -m "Fix spelling target display in both choice and word-builder modes"
            git push
          fi
