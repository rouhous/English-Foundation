name: Import approved vocabulary images 001-036
on:
  push:
    paths:
      - 'assets/import/MEJ_Approved_001-036_36_images_384.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.1.0
      - name: Install approved images 1 through 36
        run: python scripts/install_mej_001_036.py
      - name: Commit installed assets and image bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mej-batch-001-036 assets/approved-images-12.js
          if ! git diff --cached --quiet; then
            git commit -m "Link 36 user-approved images to words 001-036"
            git push
          fi
