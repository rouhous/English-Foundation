name: Apply per-teacher student registration
on:
  push:
    paths:
      - scripts/install_per_teacher_registration.py
      - .github/workflows/install-per-teacher-registration.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Link student admission to teacher invitation
        run: python3 scripts/install_per_teacher_registration.py
      - name: Validate all inline scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert s.count('MEJ_PER_TEACHER_100_SEATS_V2') == 1
          assert "teacherInvite" in s
          for i,script in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)):
            if script.strip(): Path('/tmp/mej'+str(i)+'.js').write_text(script)
          PY
          for file in /tmp/mej*.js; do node --check "$file"; done
      - name: Commit application changes
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Require approved teacher invitation for student enrollment"
            git push
          fi
