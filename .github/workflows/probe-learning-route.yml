name: Probe learning route
on:
  push:
    paths: ['scripts/probe_learning_route.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/probe_learning_route.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/quality-audit/learning-route-probe.json
          git diff --cached --quiet || (git commit -m "Record learning page routing probe" && git push)
