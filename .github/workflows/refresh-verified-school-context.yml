name: Refresh verified school context on app launch
on:
  push:
    paths:
      - scripts/refresh_school_context.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/refresh_school_context.py
      - name: Validate student gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'MEJ_REFRESH_VERIFIED_SCHOOL_CONTEXT_20261106' in s
          assert "localStorage.setItem('MEJ_VERIFIED_SCHOOL_NAME_V1'" in s
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh server verified student school affiliation'
            git push
          fi
