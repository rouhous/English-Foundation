name: Generate natural exam listening audio (Kokoro)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exam-natural-audio
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Generate natural multi-voice listening MP3s for exam library'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source TTS
        run: python -m pip install kokoro-onnx soundfile numpy
      - name: Download pretrained free English voices
        run: |
          mkdir -p models
          curl -fL --retry 3 -o models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.fp16.onnx
          curl -fL --retry 3 -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Verify model and synthesize first Core listening sample
        run: python -u scripts/generate_exam_natural_audio.py --only g12-core-a-listening-1
      - name: Generate remaining listening recordings
        run: python -u scripts/generate_exam_natural_audio.py
      - name: Verify generated MP3 duration and content
        run: |
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          p=Path('exam-practice/index.html')
          data=json.loads(re.search(r'<script id="activityData" type="application/json">([\s\S]*?)</script>',p.read_text()).group(1))
          for a in data['activities']:
              if a.get('skill')!='listening': continue
              f=p.parent/a['audio']
              if not f.is_file() or f.stat().st_size < 10000: raise SystemExit('Missing/empty audio: '+str(f))
              duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(f)],text=True).strip())
              if duration < 25: raise SystemExit('Unusually short recording: '+str(f))
              print(a['id'],round(duration,1),'sec',f.stat().st_size,'bytes')
          PY
      - name: Update listening availability flags
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('exam-practice/index.html')
          s=p.read_text()
          m=re.search(r'(<script id="activityData" type="application/json">)([\s\S]*?)(</script>)',s)
          data=json.loads(m.group(2))
          for a in data['activities']:
              if a.get('skill')=='listening':
                  a['audioReady']=(Path('exam-practice') / a.get('audio','')).is_file()
          s=s[:m.start()]+m.group(1)+json.dumps(data,indent=2,ensure_ascii=False)+m.group(3)+s[m.end():]
          p.write_text(s)
          PY
      - name: Commit audio and updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam-practice/index.html exam-practice/audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate natural multi-voice listening MP3s for exam library"
            git push
          fi
