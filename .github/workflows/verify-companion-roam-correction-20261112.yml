name: Verify companion roam and explanations
on:
  push:
    paths:
      - 'scripts/verify_companion_roam_correction_20261112.cjs'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script and answer events
        run: node scripts/verify_companion_roam_correction_20261112.cjs
      - name: Commit test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/quality-audit/companion-roam-correction-20261112.json
          if ! git diff --cached --quiet; then
            git commit -m "Record companion roaming and correction QA"
            git push
          fi
