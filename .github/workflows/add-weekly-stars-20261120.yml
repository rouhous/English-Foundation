name: Record exact weekly earned stars in student learning
on:
  push:
    paths:
      - "scripts/add-weekly-stars-20261120.cjs"
      - ".github/workflows/add-weekly-stars-20261120.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/add-weekly-stars-20261120.cjs
      - name: Commit after safe rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Record each newly earned star with exact student attempt time"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
