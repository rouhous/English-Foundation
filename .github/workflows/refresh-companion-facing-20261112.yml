name: Refresh companion facing asset
on:
  push:
    paths:
      - 'scripts/refresh_companion_facing_asset_20261112.cjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify companion animation syntax and update asset URL
        run: node scripts/refresh_companion_facing_asset_20261112.cjs
      - name: Commit verified reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reviews/quality-audit/companion-facing-20261112.json
          if ! git diff --cached --quiet; then
            git commit -m "Load companion directional turn animation v3"
            git push
          fi
