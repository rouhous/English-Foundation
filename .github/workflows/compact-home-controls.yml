name: Compact learner controls on home
on:
  push:
    paths:
      - scripts/compact_home_controls.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/compact_home_controls.py
      - name: Check mobile markup and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert s.count('MEJ_COMPACT_HOME_CONTROLS_20261106')==1
          assert s.count('class="m31-sea"')==1
          assert 'assets/mej-user-voyage.png' in s
          assert 'onclick="letsGo()"' in s
          assert 'onclick="openProfile(true)"' in s
          assert 'onclick="openJourneySettings()"' in s
          for i,v in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)):
            if v.strip():Path('/tmp/mej-compact-'+str(i)+'.js').write_text(v)
          PY
          for f in /tmp/mej-compact-*.js; do node --check "$f"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Compact learner controls and raise start and rights on home"
            git push
          fi
