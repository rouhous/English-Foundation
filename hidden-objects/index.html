<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hidden Objects — رحلتي مع الإنجليزية</title>
<style>
:root{font:16px system-ui,"Segoe UI",sans-serif;color:#fff;background:#062c43}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:linear-gradient(150deg,#0d6e8f,#04233d);overflow-x:hidden}
.shell{max-width:1240px;margin:auto;padding:12px;display:grid;grid-template-rows:auto auto minmax(330px,1fr) auto;gap:10px;min-height:100dvh}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#033d5bb8;border:1px solid #66b9d7;border-radius:16px;padding:10px 14px}
h1{font-size:clamp(21px,4vw,32px);margin:0}.status{font-size:15px;font-weight:800;display:flex;gap:9px;flex-wrap:wrap}.chip{padding:6px 10px;border-radius:99px;background:#0c6a83;border:1px solid #8cdbe4}
.instruction{margin:0;background:#073d59bd;padding:10px 14px;border-radius:12px;line-height:1.7}
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,240px);gap:10px;direction:ltr;min-height:360px}
.scene{position:relative;aspect-ratio:1.65;min-height:330px;border:3px solid #b4d4bb;border-radius:18px;overflow:hidden;background:#8cb5ab center/cover;box-shadow:0 9px 30px #001e29aa;touch-action:manipulation}
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#07262340,transparent 27%,#f0e7bd12);z-index:0}
.scene.photo-active{display:flex;align-items:center;justify-content:center;background:#031c2f;border-color:#c7a45b;min-height:0}
.photo-board{position:relative;width:100%;aspect-ratio:1599 / 900;background-size:100% 100%;background-position:center;background-repeat:no-repeat;flex:0 0 auto}
.photo-target{position:absolute;transform:translate(-50%,-50%);height:max(36px,6%);width:max(36px,5%);border:0;border-radius:50%;background:transparent;cursor:pointer;opacity:1;z-index:2;padding:0;touch-action:manipulation}
.photo-target:focus-visible{outline:3px solid #ffe880;outline-offset:2px;background:#ffd65f30}
.photo-target.found{pointer-events:none}
.photo-target.found::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font:900 25px system-ui;color:white;background:#168665c7;border:2px solid #ccf3d7;border-radius:50%;text-shadow:0 1px 3px #002}
.photo-board.show-hotspots .photo-target:not(.found){background:#e5c64255;border:2px solid #ffe667}
@media(max-width:710px){.scene.photo-active{aspect-ratio:auto;min-height:215px}.photo-board{width:100%;height:auto}.photo-target{width:max(32px,6%);height:max(32px,7%)}}
.spot{position:absolute;border:0;background:none;padding:0;width:clamp(31px,5.8vw,62px);height:clamp(31px,5.8vw,64px);transform:translate(-50%,-50%);cursor:pointer;filter:drop-shadow(1px 2px 2px #2c342887) saturate(.88);opacity:.93;mix-blend-mode:normal;border-radius:12px;transition:filter .15s,opacity .15s}
.spot img{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.scene.mode-picture .spot{opacity:.97;filter:drop-shadow(1px 1px 2px #3d3a2f77) saturate(.92)}
.scene.mode-silhouette .spot{opacity:.89;filter:drop-shadow(1px 2px 2px #3c4b3660) saturate(.79)}
.scene.mode-word .spot{opacity:.81;filter:drop-shadow(1px 1px 2px #4553355a) saturate(.68)}
.timer-toggle{border:1px solid #a8dce4;background:#124a5b;color:#fff;font:750 13px system-ui;cursor:pointer}
.timer-toggle:disabled{opacity:.6;cursor:default}
.spot:focus-visible{outline:3px solid #ffe36d;outline-offset:2px}.spot:active{filter:brightness(1.5)}.spot.found{opacity:0;pointer-events:none}
.words{direction:ltr;text-align:left;border:1px solid #7bb9d1;background:#082f4aef;border-radius:17px;padding:12px;max-height:100%;overflow:auto}
.words h2{font-size:17px;margin:0 0 10px}.words ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}.words li{font-size:clamp(14px,2vw,18px);padding:7px 10px;border-radius:9px;background:#12516a;font-weight:750}.words li.found{color:#89d9af;text-decoration:line-through;opacity:.72}
.words li{display:flex;gap:9px;align-items:center;min-height:41px}
.words li .guide-art{flex:0 0 35px;display:grid;place-items:center;width:35px;height:35px;background:#ecf3e5;border:1px solid #a9dbe1;border-radius:9px}
.words li .guide-art .guide-emoji{font-size:25px;line-height:1}
.words li .guide-art img{width:31px;height:31px;object-fit:contain}
.words li.guide-silhouette .guide-art{background:#d9e0d9}
.words li.guide-silhouette .guide-art img{filter:grayscale(1) brightness(0);opacity:.88}
.words li.guide-word-only{min-height:35px}
.words li.found .guide-art{opacity:.52}
@media(max-width:710px){.words li{flex-direction:column;gap:2px}.words li .guide-art{width:28px;height:28px;flex-basis:28px}.words li .guide-art img{width:24px;height:24px}.words li .guide-art .guide-emoji{font-size:21px}}

.foot{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;background:#073c58b5;border:1px solid #78c5d8;border-radius:13px;padding:11px;min-height:50px}
button.back{background:#e8c875;border:0;border-radius:12px;font:800 15px system-ui;padding:10px 15px;color:#173b4d;cursor:pointer}
#notice{font-weight:800;color:#f4efbd;line-height:1.6;text-align:center}.end{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:#07293cdd;padding:16px}.end-card{width:min(96%,420px);background:#f0fbfc;color:#173f59;border-radius:20px;border:4px solid #d6ad61;padding:23px;text-align:center;box-shadow:0 12px 35px #001f2788}.end-card h2{font-size:27px;color:#0b697c}.end-card strong{font-size:38px;color:#ad7a12}
@media(max-width:710px){.shell{padding:7px;gap:7px}.play{grid-template-columns:1fr;grid-template-rows:minmax(280px,auto) auto}.scene{min-height:285px;aspect-ratio:1.15}.words{max-height:170px;padding:8px}.words ul{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.words li{font-size:11px;text-align:center;padding:5px 2px;overflow-wrap:anywhere}.words h2{font-size:13px}.spot{width:clamp(28px,8vw,46px);height:clamp(30px,9vw,49px)}}
</style></head><body>
<main class="shell">
<header class="head"><h1>🔎 Hidden Objects</h1><div class="status"><span class="chip" id="stage">الجزيرة</span><span class="chip" id="found">0 / 10</span><span class="chip" id="mistakes">❤️❤️❤️</span><span class="chip" id="timer">⏱️ بدون مؤقت</span><span class="chip" id="bonus">⭐ 0/5</span><button type="button" class="chip timer-toggle" id="timerToggle">تحدّي الوقت (3 دقائق)</button></div></header>
<p class="instruction" id="instruction">ابحث عن الأغراض الإنجليزية في المشهد. ثلاث نقرات خاطئة تنهي الجولة. كل غرضين صحيحين = ⭐ واحدة.</p>
<div class="play"><div id="scene" class="scene" aria-label="مشهد البحث عن الأغراض" role="group"></div><aside class="words"><h2>Find these objects:</h2><ul id="words"></ul></aside></div>
<footer class="foot"><span id="notice" role="status">اختر الغرض الذي يطابق كلمة في القائمة.</span><button class="back" id="back">↩ العودة إلى الرحلة</button></footer>
</main>
<script src="./assets.js"></script><script src="./photo-scenes.js"></script>
<script>
(()=>{'use strict';
const ART=window.MEJHiddenArt;const PHOTO=window.MEJRealPhotoScenes;const el=id=>document.getElementById(id);
let session=null,completed=false,lastClick=0,lastTime=0,timerHandle=null,photoScene=null;
let words=ART.words,images=ART.images;
const GUIDE_EMOJI=['🍎','📚','✏️','🍌','🐚','🪢','🗝️','🍊','🧭','🏮','🍼','🗺️','🔔','🔭','🛶','👝'];
// An independent symbol must match the *current word*; IDs can be rebound
// to curriculum vocabulary, so the old fixed-index emojis were misleading.
const GUIDE_ICONS={
apple:'🍎',book:'📖',pencil:'✏️',banana:'🍌',shell:'🐚',rope:'🪢',key:'🗝️',orange:'🍊',compass:'🧭',lantern:'🏮',bottle:'🍼',map:'🗺️',bell:'🔔',telescope:'🔭',oar:'🛶',pouch:'👝',
pen:'🖊️',school:'🏫',teacher:'🧑‍🏫',student:'🎒',bag:'👜',backpack:'🎒',table:'🪑',chair:'🪑',desk:'🪑',door:'🚪',window:'🪟',clock:'🕰️',watch:'⌚',camera:'📷',phone:'📱',computer:'💻',laptop:'💻',tablet:'📱',keyboard:'⌨️',mouse:'🖱️',headphones:'🎧',
ball:'⚽','football':'⚽','soccer ball':'⚽',basketball:'🏀',bike:'🚲',bicycle:'🚲',car:'🚗',bus:'🚌',train:'🚆',plane:'✈️',airplane:'✈️',boat:'⛵',ship:'🚢',dhow:'⛵',
cat:'🐈',dog:'🐕',bird:'🐦',fish:'🐟',horse:'🐎',cow:'🐄',camel:'🐪',turtle:'🐢',butterfly:'🦋',bee:'🐝',
sun:'☀️',moon:'🌙',star:'⭐',cloud:'☁️',tree:'🌳',flower:'🌼',leaf:'🍃',mountain:'⛰️',river:'🏞️',beach:'🏖️',island:'🏝️',sand:'🏜️',sea:'🌊',
house:'🏠',home:'🏠',building:'🏢',hospital:'🏥',market:'🏬',shop:'🏪',castle:'🏰',fort:'🏰',bridge:'🌉',mosque:'🕌',library:'📚',
orange:'🍊',pear:'🍐',grape:'🍇',grapes:'🍇',strawberry:'🍓',watermelon:'🍉',lemon:'🍋',carrot:'🥕',tomato:'🍅',potato:'🥔',bread:'🍞',egg:'🥚',milk:'🥛',water:'💧',juice:'🧃',rice:'🍚',cheese:'🧀',cake:'🎂',pizza:'🍕',
spoon:'🥄',fork:'🍴',knife:'🍽️',plate:'🍽️',cup:'☕',mug:'☕',glass:'🥛',pot:'🍲',basket:'🧺',box:'📦',gift:'🎁',toy:'🧸','teddy bear':'🧸',doll:'🪆',
hat:'🧢',cap:'🧢',shirt:'👕',shoe:'👞',shoes:'👞',socks:'🧦',dress:'👗',coat:'🧥',umbrella:'☂️',glasses:'👓',
brush:'🖌️','toothbrush':'🪥',toothpaste:'🪥',soap:'🧼',towel:'🧻',bed:'🛏️',lamp:'💡',light:'💡',flag:'🚩',coin:'🪙',money:'💰',wallet:'👛',
paper:'📄',newspaper:'📰',magazine:'📖',letter:'✉️',envelope:'✉️',picture:'🖼️',photo:'📷',painting:'🖼️',globe:'🌐',ruler:'📏',eraser:'🧽',scissors:'✂️',
doctor:'🩺',nurse:'🧑‍⚕️',scientist:'🧑‍🔬',farmer:'🧑‍🌾',pilot:'🧑‍✈️',firefighter:'🧑‍🚒',chef:'🧑‍🍳',
'trash can':'🗑️',bin:'🗑️',robot:'🤖',battery:'🔋',charger:'🔌',microphone:'🎤',radio:'📻',television:'📺',tv:'📺',remote:'📱',lantern:'🏮',bicycle:'🚲',dates:'🌴',dallah:'☕',oranges:'🍊',donkey:'🐴',bridge:'🌉',waterfall:'💦',barrel:'🛢️',net:'🥅',seagull:'🐦',lifebuoy:'🛟',chest:'🧰',apples:'🍎','ship model':'⛵',camera:'📷',rope:'🪢',compass:'🧭',binoculars:'🔭'
};
function visualCue(word,id){
 const name=String(word||'').trim().toLowerCase().replace(/\s+/g,' ');
 return GUIDE_ICONS[name]||(name===ART.words[id]?GUIDE_EMOJI[id]:null);
}
let guideMode='word';
function guideFor(id){
 if(guideMode==='word')return null;
 const art=document.createElement('span');art.className='guide-art';art.setAttribute('aria-hidden','true');
 if(guideMode==='picture'){
   // Independent illustrated hints, never the same photograph/sprite in the scene.
   const cue=visualCue(words[id],id);
   if(!cue)return null; // Never show a misleading icon for a replaced curriculum word.
   const icon=document.createElement('span');icon.className='guide-emoji';icon.textContent=cue;art.append(icon);
 }else{
   // Use monochrome illustrated hints tied to the actual word, never stale photos.
   const cue=visualCue(words[id],id);if(!cue)return null;
   const icon=document.createElement('span');icon.className='guide-emoji';icon.textContent=cue;
   icon.style.filter='grayscale(1) brightness(0)';art.append(icon);
 }
 return art;
}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const shuffle=(arr,seed)=>{let t=seed>>>0;const rand=()=>{t=(Math.imul(t,1664525)+1013904223)>>>0;return t/4294967296};const a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function board(){
 const field=el('scene');field.replaceChildren();field.className='scene mode-'+guideMode;
 if(photoScene){
   field.classList.add('photo-active');field.style.backgroundImage='none';
   const canvas=document.createElement('div');canvas.className='photo-board';
   canvas.style.backgroundImage='url("'+PHOTO.root+photoScene.file+'")';
   if(new URLSearchParams(location.search).get('debug')==='hotspots')canvas.classList.add('show-hotspots');
   session.targets.forEach((id,i)=>{
     const entry=photoScene.targets[i];
     const b=document.createElement('button');b.type='button';b.className='photo-target';
     b.style.left=(entry.x*100)+'%';b.style.top=(entry.y*100)+'%';
     b.setAttribute('aria-label','Find '+entry.word);
     if(session.found.includes(id)){b.classList.add('found');b.disabled=true}
     b.addEventListener('click',ev=>{ev.stopPropagation();tap(id)});
     canvas.append(b);
   });
   field.append(canvas);
   canvas.addEventListener('click',ev=>{if(!ev.target.closest('.photo-target'))wrong()});
   renderListAndScores();return;
 }
 const backgrounds=ART.scenes||[ART.background],view=backgrounds[session.scene%backgrounds.length];
 field.style.backgroundImage='linear-gradient(0deg,#2943341c,#d3bc8a0d),url("'+view+'")';
 const choices=shuffle(words.map((_,i)=>i).filter(i=>i!==6),session.seed);
 const positions=shuffle(Array.from({length:15},(_,i)=>({
  x:9+(i%5)*20+(i%3)*2.1,y:15+Math.floor(i/5)*32+(i%4)*1.8
 })),session.seed+91);
 choices.forEach((id,i)=>{if(session.found.includes(id))return;
  const item=document.createElement('button');item.type='button';item.className='spot';
  item.style.left=positions[i].x+'%';item.style.top=positions[i].y+'%';
  item.style.transform='translate(-50%,-50%) rotate('+(((i*7+session.seed)%29)-14)+'deg) scale('+(.82+(i%5)*.06)+')';
  item.setAttribute('aria-label','Object '+(i+1));item.dataset.item=id;
  const img=document.createElement('img');img.src=images[id];img.alt='';item.append(img);
  item.addEventListener('click',ev=>{ev.stopPropagation();tap(id)});field.append(item);
 });

 renderListAndScores();
}
function renderListAndScores(){
 const list=el('words');list.replaceChildren();
 for(const id of session.targets){
   const li=document.createElement('li'),done=session.found.includes(id);
   li.className=(done?'found ':'')+(guideMode==='picture'?'guide-picture':guideMode==='silhouette'?'guide-silhouette':'guide-word-only');
   const guide=guideFor(id);if(guide)li.append(guide);
   const label=document.createElement('span');label.textContent=(done?'✓ ':'')+words[id];li.append(label);list.append(li);
 }

 el('stage').textContent='الجزيرة '+session.stage+' · الشارة '+session.badge;
 el('found').textContent=session.found.length+' / 10';
 el('bonus').textContent='⭐ '+Math.floor(session.found.length/2)+'/5';
 el('mistakes').textContent='❤️'.repeat(Math.max(0,3-session.misses))+'🖤'.repeat(session.misses);
}
function send(done){parent.postMessage({type:'mej:hidden-progress',stage:session.stage,badge:session.badge,found:[...session.found],misses:session.misses,remaining:session.remaining,ended:!!done},location.origin)}
function tap(id){if(completed)return;const now=Date.now();if(now-lastClick<330)return;lastClick=now;
 if(!session.targets.includes(id)){wrong(true);return}
 if(session.found.includes(id))return;
 session.found.push(id);el('notice').textContent='Excellent! '+words[id]+' ✓';
 if(session.found.length===10){finish('all');return}
 send(false);board();
}
function wrong(item){if(completed)return;const now=Date.now();if(now-lastClick<330&&!item)return;lastClick=now;
 session.misses=Math.min(3,session.misses+1);
 el('notice').textContent='Try again! خطأ '+session.misses+' من 3';
 if(session.misses>=3){finish('mistakes');return}send(false);board();
}
function finish(reason){if(completed)return;completed=true;clearInterval(timerHandle);session.ended=true;send(true);board();
 const award=Math.floor(session.found.length/2);
 const box=document.createElement('div');box.className='end';box.innerHTML='<div class="end-card"><h2>'+(reason==='all'?'أحسنت! اكتملت الجولة 🎉':reason==='mistakes'?'انتهت المحاولات الثلاث':'انتهى الوقت')+'</h2><p>جمعت '+session.found.length+' من 10 أغراض</p><strong>+'+award+' ⭐</strong><p>نجمة لكل غرضين صحيحين</p><button class="back" id="closeGame">العودة إلى رحلتي</button></div>';
 el('scene').append(box);el('closeGame').onclick=()=>parent.postMessage({type:'mej:hidden-close'},location.origin);
}
function tick(){if(!session||completed||session.remaining==null)return;const now=Date.now();const diff=clamp(Math.floor((now-lastTime)/1000),0,8);if(diff){lastTime=now;session.remaining=Math.max(0,session.remaining-diff);const sec=session.remaining;el('timer').textContent='⏱️ '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(sec<=0){finish('timeout');return}if(sec%10===0)send(false)}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='mej:hidden-init'||session)return;
 const d=e.data;
 // Stage is the learner's actual island level, not merely their registered grade.
 const phase=Math.max(0,Math.min(12,Math.floor(Number(d.stage)||0)));
 guideMode=phase<=4?'picture':phase<=8?'silhouette':'word';
 el('instruction').textContent=guideMode==='picture'?'ابحث عن الأغراض بمساعدة الكلمات والرسومات الإرشادية. كل غرضين = نجمة إضافية. ثلاث أخطاء تنهي الجولة.':guideMode==='silhouette'?'ابحث عن الأغراض بالاستعانة بالكلمات والظلال فقط. كل غرضين = نجمة إضافية. ثلاث أخطاء تنهي الجولة.':'اقرأ الكلمات الإنجليزية وحدد الأغراض داخل المشهد دون صور أو ظلال مساعدة. كل غرضين = نجمة إضافية. ثلاث أخطاء تنهي الجولة.';
 if(Array.isArray(d.items)&&d.items.length===16){
   words=ART.words.map((word,i)=>typeof d.items[i]?.word==='string'?d.items[i].word:word);
   images=ART.images.map((src,i)=>typeof d.items[i]?.src==='string'&&/^(data:image\/|\.\.?\/assets\/)/i.test(d.items[i].src)?d.items[i].src:src);
 }
 const all=words.map((_,i)=>i).filter(i=>i!==6);
 const seed=Number(d.stage)*7919+Number(d.badge)*1013;
 const proposed=shuffle(all,seed).slice(0,10);const saved=d.saved||{};
 session={stage:d.stage,badge:d.badge,seed,scene:d.scene||0,targets:proposed,
  found:Array.isArray(saved.found)?saved.found.filter(x=>proposed.includes(x)).slice(0,10):[],
  misses:clamp(Number(saved.misses)||0,0,3),remaining:saved.remaining==null?null:clamp(Math.floor(Number(saved.remaining)||0),0,180),ended:false};
 if(session.remaining==null)el('timer').textContent='⏱️ بدون مؤقت';
 else{el('timer').textContent='⏱️ '+Math.floor(session.remaining/60)+':'+String(session.remaining%60).padStart(2,'0');el('timerToggle').disabled=true;}
 // When the photo files are installed the objects are searched in the
 // original illustration, not as separate floating sprites.
 const scenes=PHOTO?.scenes||[];
 const photoIndex=scenes.length?((Number(d.stage)*10+Number(d.badge))%scenes.length):0;
 const mapped=scenes[photoIndex]||null;
 const start=()=>{
   if(photoScene)session.targets.forEach((id,i)=>{words[id]=photoScene.targets[i].word});
   board();
   if(session.misses>=3||session.found.length===10||session.remaining===0){finish(session.found.length===10?'all':session.misses===3?'mistakes':'timeout');return}
   lastTime=Date.now();if(session.remaining!=null)timerHandle=setInterval(tick,1000);
 };
 if(mapped && mapped.targets?.length===10){
   const img=new Image();img.onload=()=>{photoScene=mapped;start()};
   img.onerror=()=>{photoScene=null;start()};
   img.src=PHOTO.root+mapped.file;
 }else start();
});
el('scene').addEventListener('click',ev=>{if(ev.target.closest('.spot,.photo-target,.photo-board,.end'))return;wrong()});
el('timerToggle').onclick=()=>{
 if(!session||completed||session.remaining!=null)return;
 session.remaining=180;lastTime=Date.now();el('timerToggle').disabled=true;
 el('timer').textContent='⏱️ 3:00';el('notice').textContent='بدأ تحدّي الوقت: 3 دقائق. انتهِ قبل انتهاء الوقت!';
 timerHandle=setInterval(tick,1000);send(false);
};
el('back').onclick=()=>parent.postMessage({type:'mej:hidden-close'},location.origin);
parent.postMessage({type:'mej:hidden-ready'},location.origin);
})();
</script></body></html>
