name: Retire My English Journey test profiles
on:
  push:
    paths:
      - scripts/reset_test_profiles.py
      - scripts/test_reset_profiles.js
      - .github/workflows/reset-mej-test-profiles.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply one-time client reset
        run: python3 scripts/reset_test_profiles.py
      - name: Check idempotence and preservation of other apps
        run: node scripts/test_reset_profiles.js
      - name: Re-run approved assets validation
        run: python3 scripts/check_prelaunch_assets.py
      - name: Save checked reset to original app
        run: |
          if ! git diff --quiet -- index.html diagnostics/prelaunch-asset-validation.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html diagnostics/prelaunch-asset-validation.json
            git commit -m "Retire old My English Journey test profiles once per browser"
            git push
          fi
