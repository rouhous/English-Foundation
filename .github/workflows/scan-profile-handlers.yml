name: Inspect profile registration handlers
on:
  push:
    paths:
      - scripts/scan_profile_handlers.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show narrow registration function excerpts
        run: python3 scripts/scan_profile_handlers.py
