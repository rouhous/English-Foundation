name: Apply approved full-screen poster home
on:
  push:
    paths:
      - scripts/apply_approved_poster_home.py
      - .github/workflows/apply-approved-poster-home.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install approved poster-style live homepage
        run: python3 scripts/apply_approved_poster_home.py
      - name: Validate JavaScript and layout markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          x=Path('index.html').read_text(encoding='utf8')
          assert x.count('MEJ_APPROVED_POSTER_FULL_SCREEN_LAYOUT_20261106')==1
          assert x.count('class="m31-sea"')==1
          assert 'mej-portrait-voyage-overlay' not in x
          assert 'onclick="letsGo()"' in x
          assert 'onclick="openJourneySettings()"' in x
          for n,v in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',x,re.S|re.I)):
            if v.strip():Path('/tmp/mej-post-'+str(n)+'.js').write_text(v,encoding='utf8')
          PY
          for f in /tmp/mej-post-*.js; do node --check "$f"; done
      - name: Commit
        run: |
          if ! git diff --quiet -- index.html sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sw.js
            git commit -m "Align functional homepage with full-screen maritime poster reference"
            git push
          fi
