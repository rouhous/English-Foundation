name: Verify compact levels and skill navigation
on:
  push:
    paths:
      - scripts/test_mej_mobile_ui.py
      - .github/workflows/test-mej-mobile-ui.yml
      - assets/mej-skill-expansion-v1.js
      - assets/mej-mobile-ui-v2.css
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python3 scripts/test_mej_mobile_ui.py
      - name: Save static regression status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/mej-mobile-ui-qa.json
          if ! git diff --cached --quiet; then
            git commit -m "Record compact levels and skills regression checks"
            git push
          fi
