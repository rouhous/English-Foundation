name: Install fully offline WebGL companion
on:
  push:
    paths:
      - scripts/install_companion_3d.py
      - .github/workflows/install-companion-3d.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and integrate 3D mascot
        run: python3 scripts/install_companion_3d.py
      - name: Commit application integration
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Add offline WebGL 3D Omani learner companions"
            git push
          fi
