name: Verify learning review images and cache refresh
on:
  push:
    paths:
      - 'scripts/check_learning_review_images.cjs'
      - 'reviews/learning.html'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate review and service worker source
        run: node scripts/check_learning_review_images.cjs
