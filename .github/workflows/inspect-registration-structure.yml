name: Inspect learner registration structure
on:
  push:
    paths:
      - scripts/inspect_registration_structure.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan names only
        run: python3 scripts/inspect_registration_structure.py
      - name: Commit structural metadata
        run: |
          git add diagnostics/registration-structure.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record registration structure for pilot capacity binding"
            git push
          fi
