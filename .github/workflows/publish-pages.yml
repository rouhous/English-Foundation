name: Publish runtime-only GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-runtime-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble the runtime-only site
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE"
          publish_dir="$RUNNER_TEMP/mej-pages"
          mkdir -p "$publish_dir"

          # Root shell and PWA metadata referenced by index.html / manifest.
          for file in index.html sw.js manifest.webmanifest mobile-home-fix.css icon-192.png icon-512.png; do
            test -f "$source_dir/$file" || { echo "Missing required runtime file: $file" >&2; exit 1; }
            cp -a "$source_dir/$file" "$publish_dir/"
          done

          # Copy the seven runtime trees while excluding known development/archive material.
          # Keep all other extensions and paths so nested runtime imports and media survive.
          for dir in assets coastal-arcade hidden-objects boat-game exam-practice games omani-sailor; do
            test -d "$source_dir/$dir" || { echo "Missing required runtime directory: $dir" >&2; exit 1; }
            mkdir -p "$publish_dir/$dir"
            rsync -a \
              --exclude='*.zip' \
              --exclude='*.md' \
              --exclude='*.b64' \
              --exclude='qa*/' \
              --exclude='import/' \
              "$source_dir/$dir/" "$publish_dir/$dir/"
          done

          # Public review, teacher, school, and owner routes required by the app.
          mkdir -p "$publish_dir/reviews"
          for file in \
            teacher-portal.html owner-login.html admin-preview.html pilot-full.html \
            admin-levels-catalog.json admin-levels.html portal-manifest.webmanifest \
            teacher-dashboard.html school-dashboard.html teacher-reports.html activate.html \
            owner-review.html learning.html; do
            test -f "$source_dir/reviews/$file" || { echo "Missing required public review page: reviews/$file" >&2; exit 1; }
            cp -a "$source_dir/reviews/$file" "$publish_dir/reviews/"
          done

          # Fail closed if any service-worker CORE precache item was omitted.
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const output = process.env.RUNNER_TEMP + '/mej-pages';
          const sw = fs.readFileSync(path.join(output, 'sw.js'), 'utf8');
          const match = sw.match(/const\\s+CORE\\s*=\\s*\\[([\\s\\S]*?)\\];/);
          if (!match) throw new Error('Could not locate the CORE array in sw.js');
          const entries = [...match[1].matchAll(/(['"])(.*?)\\1/g)].map(m => m[2]);
          if (!entries.length) throw new Error('The sw.js CORE array is empty or unreadable');
          const missing = entries.filter(entry => {
            const relative = decodeURIComponent(entry).replace(/^\\.\\//, '');
            return !fs.existsSync(path.resolve(output, relative));
          });
          if (missing.length) {
            console.error('Missing sw.js CORE precache entries:', missing.join(', '));
            process.exit(1);
          }
          console.log(`Verified all ${entries.length} sw.js CORE precache entries exist in the assembled output.`);
          NODE

          # GitHub Pages must not apply Jekyll processing to runtime assets.
          : > "$publish_dir/.nojekyll"

      - name: Replace gh-pages with the assembled runtime output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # This is an output branch, rebuilt from scratch on every main push.
          git branch -D gh-pages 2>/dev/null || true
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -a "$RUNNER_TEMP/mej-pages/." "$GITHUB_WORKSPACE/"
          git add --all
          git commit -m "Publish runtime-only Pages output from ${GITHUB_SHA}"
          git push --force origin gh-pages
