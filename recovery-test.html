<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار اتصال الحفظ السحابي</title><style>body{font-family:system-ui;background:#eef6fa;color:#163b51;padding:22px;line-height:1.8}main{max-width:680px;margin:auto;background:white;border-radius:20px;padding:24px}button{background:#126d94;color:white;border:0;border-radius:12px;padding:13px;font-size:17px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:12px;border-radius:8px}iframe{width:1px;height:1px;border:0;position:absolute;left:-9999px}</style></head><body><main><h2>اختبار الجسر التشخيصي — STAGING</h2><p>هذا اختبار اتصال فقط، ولا يرسل بيانات طالب أو يغيّر تقارير Google Sheets.</p><button id="retry">إعادة الاختبار</button><p id="state" role="status">جارٍ التهيئة…</p><pre id="log"></pre><div id="host"></div></main><script>
const url='https://script.google.com/macros/s/AKfycbwx9rTHXR5bRiP7qAQ7wVyEfZs3Ell7MODDKiMIr0fEAwqZsqbOsh1VFTRi3aQWb9TpXg/exec?recoveryDiagnostic=1';
let frame, timer, ready=false, nonce='';
const state=document.getElementById('state'),log=document.getElementById('log'),host=document.getElementById('host');
function note(t){log.textContent+=new Date().toLocaleTimeString()+' — '+t+'\n'}
function start(){clearTimeout(timer);ready=false;log.textContent='';host.replaceChildren();frame=document.createElement('iframe');frame.title='Recovery bridge';nonce=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');frame.src=url+'&nonce='+nonce+'&probe='+Date.now();frame.onload=()=>{note('حدث تحميل iframe (لا يعني وصول رسالة الجاهزية)');note('اختبار إرسال رسالة غير حساسة إلى iframe');try{frame.contentWindow.postMessage({eeRecoveryRequest:true,requestId:'diagnostic-only',method:'invalid-diagnostic-action',payload:null},'*')}catch(err){note('تعذّر إرسال رسالة الاختبار: '+String(err))}};frame.onerror=()=>note('تعذّر تحميل iframe');host.append(frame);state.textContent='بانتظار رسالة الجاهزية من الجسر…';note('الأصل: '+location.origin);timer=setTimeout(()=>{if(!ready){state.textContent='لم تصل رسالة الجاهزية خلال 15 ثانية';note('النتيجة: TIMEOUT — راجع منع الإطارات أو رسائل postMessage')}},15000)}
window.addEventListener('message',e=>{let x=e.data;if(typeof x==='string'){try{x=JSON.parse(x)}catch{return}}if(!x||typeof x!=='object'||x.eeRecoveryBridge!==true){if(e.origin.includes('google')||e.origin==='https://rouhous.github.io')note('رسالة غير مخصصة للجسر من '+e.origin+' | مصدر iframe مطابق='+(e.source===frame?.contentWindow));return;}const valid=e.source===frame?.contentWindow;note('رسالة جسر من origin='+e.origin+' | مصدر iframe مطابق='+valid+' | ready='+Boolean(x.ready));const googleOrigin=/^https:\/\/[a-z0-9-]+\.script\.googleusercontent\.com$/.test(e.origin);if(googleOrigin&&x.diagnostic==='nonce-v2'&&x.nonce===nonce&&x.ready===true){ready=true;clearTimeout(timer);state.textContent='نجح اختبار القناة المشخّصة برمز جلسة ✓';note('PASS: matching nonce, expected diagnostic marker and Google origin. No student data operations tested.')}else{note('رسالة غير مقبولة: marker='+String(x.diagnostic)+' | nonce مطابق='+(x.nonce===nonce)+' | نطاق Google مطابق='+googleOrigin)}});
document.getElementById('retry').onclick=start;start();
</script></body></html>
