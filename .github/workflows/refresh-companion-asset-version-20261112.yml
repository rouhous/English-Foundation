name: Refresh companion asset version
on:
  push:
    paths:
      - 'scripts/refresh_companion_asset_version_20261112.cjs'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh companion cache-busting URL
        run: node scripts/refresh_companion_asset_version_20261112.cjs
      - name: Commit bundle reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reviews/quality-audit/companion-asset-version-20261112.json
          if ! git diff --cached --quiet; then
            git commit -m "Load newly updated companion movement bundle"
            git push
          fi
