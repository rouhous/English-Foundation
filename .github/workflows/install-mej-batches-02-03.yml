name: Install approved vocabulary batches 02-03
on:
  push:
    paths:
      - 'assets/import/MEJ_Batches_02_03_17-48_32images_384.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - run: python scripts/install_mej_batches_02_03.py
      - name: Commit verified images and vocabulary mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mej-batches-02-03 assets/approved-images-12.js
          if ! git diff --cached --quiet; then
            git commit -m "Install 32 approved pictures for vocabulary 17-48"
            git push
          fi
