    paths: ['scripts/inspect_existing_hunt_20261112.cjs']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/inspect_existing_hunt_20261112.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.github.com"
          git add reviews/quality-audit/hidden-hunt-source-details-20261112.json
