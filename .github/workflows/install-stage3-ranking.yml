name: Install protected Stage 3 class ranking tab
on:
  push:
    paths:
      - scripts/install_stage3_ranking.py
      - assets/class-ranking-v1.js
      - assets/class-ranking-route-v1.js
      - assets/class-ranking-v1.css
      - scripts/test_stage3_ranking_view.js
      - .github/workflows/install-stage3-ranking.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install protected ranking tab
        run: python3 scripts/install_stage3_ranking.py
      - name: Validate scripts and synthetic display
        run: |
          node --check assets/class-ranking-v1.js
          node --check assets/class-ranking-route-v1.js
          node scripts/test_stage3_ranking_view.js
      - name: Save reviewed app changes
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Show class ranking tab with verified-only access notice"
            git push
          fi
